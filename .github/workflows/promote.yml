name: Promote Rolling to Stable

on:
  workflow_dispatch:
    inputs:
      images:
        description: Images
        required: true
        type: boolean
        default: true
      flatpaks:
        description: Flatpaks
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: promote

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-26.04
    environment: "prod"
    env:
      LUDOS_S3_API: ${{ secrets.LUDOS_S3_API }}
      LUDOS_S3_KEY: ${{ secrets.LUDOS_S3_KEY }}
      LUDOS_S3_SECRET: ${{ secrets.LUDOS_S3_SECRET }}
      LUDOS_GPG_CERT: ${{ secrets.LUDOS_GPG_CERT }}
      LUDOS_GPG_KEY: ${{ secrets.LUDOS_GPG_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 100
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token

      - name: Set up Google Cloud SDK
        if: ${{ inputs.flatpaks }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Install ludos
        run: ./ludos/prepare.sh flatpaks

      - name: Generate Stable changelog
        if: ${{ inputs.images }}
        id: image
        run: |
          skopeo --override-arch amd64 inspect --no-tags \
            docker://i.anatase.org/anatase:stable \
            > previous-stable.json
          skopeo --override-arch amd64 inspect --no-tags \
            docker://i.anatase.org/anatase:rolling \
            > current-rolling.json

          version=$(jq -r \
            '.Labels["org.opencontainers.image.version"] // empty' \
            current-rolling.json)
          revision=$(jq -r \
            '.Labels["org.opencontainers.image.revision"] // empty' \
            current-rolling.json)
          if [[ -z "$version" || -z "$revision" ]]; then
            echo "Rolling image has no version or revision label" >&2
            exit 1
          fi

          venv/bin/python .github/changelog.py \
            previous-stable.json current-rolling.json \
            --channel stable > changelog.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Promote
        env:
          PROMOTE_IMAGES: ${{ inputs.images }}
          PROMOTE_FLATPAKS: ${{ inputs.flatpaks }}
        run: |
          if [[ "$PROMOTE_IMAGES" != "true" && "$PROMOTE_FLATPAKS" != "true" ]]; then
            echo "Select at least one of Images or Flatpaks" >&2
            exit 1
          fi

          args=(
            anatase.yml
            --prefix rolling-
            --from rolling
            --to stable
          )
          if [[ "$PROMOTE_IMAGES" == "true" ]]; then
            args+=(--images)
          fi
          if [[ "$PROMOTE_FLATPAKS" == "true" ]]; then
            args+=(
              --flatpaks
              --refresh
              --arch x86_64
              )
              # --arch aarch64 # lets skip you for now, until builds start
          fi
          venv/bin/ludos ci promote "${args[@]}"

      - name: Archive Stable image manifest
        if: ${{ inputs.images }}
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          skopeo --override-arch amd64 inspect --no-tags \
            docker://i.anatase.org/anatase:stable \
            > final-manifest.json
          venv/bin/ludos registry file upload \
            final-manifest.json \
            "releases/anatase/stable/$VERSION.json" \
            "$VERSION.json" \
            --sign

      - name: Create GitHub release
        if: ${{ inputs.images }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.image.outputs.revision }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          update_url="https://updates.anatase.org/$VERSION"
          update_html=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-connrefused \
            --retry-delay 2 \
            --retry-max-time 30 \
            --max-time 30 \
            "$update_url")
          summary=$(python3 .github/update-summary.py <<< "$update_html")
          update_title=$(jq -er '.title | select(length > 0)' <<< "$summary")
          update_preamble=$(jq -er '.description | select(length > 0)' <<< "$summary")

          printf '%s\n\nFull Changelog: %s\n\n## Changelog\n\n' \
            "$update_preamble" "$update_url" > release-notes.md
          cat changelog.md >> release-notes.md

          gh release create "stable-$VERSION" \
            --target "$REVISION" \
            --title "$update_title" \
            --notes-file release-notes.md

      - name: Announce release on Discord
        if: ${{ inputs.images }}
        env:
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_STABLE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.image.outputs.version }}
        run: >-
          .github/discord-notify.sh stable "$VERSION"
          "https://updates.anatase.org/$VERSION"
