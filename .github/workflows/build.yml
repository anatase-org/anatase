name: Build Anatase

on:
  workflow_dispatch:
    inputs:
      arm:
        description: Build the ARM image
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
      - testing

permissions:
  contents: write
  packages: write
  id-token: write

env:
  LUDOS_CHANNEL: ${{ github.ref_name == 'testing' && 'testing' || 'rolling' }}

concurrency:
  group: build

jobs:
  x86:
    name: Build x86_64
    uses: ./.github/workflows/build-reusable.yml
    with:
      arch: x86_64
    secrets: inherit

  arm:
    name: Build aarch64
    if: ${{ inputs.arm }}
    uses: ./.github/workflows/build-reusable.yml
    with:
      arch: aarch64
    secrets: inherit

  publish:
    name: Publish multi-platform image
    environment: prod
    needs:
      - x86
      - arm
    if: >-
      ${{
        always() &&
        needs.x86.result == 'success' &&
        (needs.arm.result == 'success' || needs.arm.result == 'skipped')
      }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Install ludos
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          pushd ludos
          ../venv/bin/pip install -r requirements.txt
          popd

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token

      - name: Resolve image version
        id: image
        env:
          ARM_ENABLED: ${{ inputs.arm }}
        run: |
          version=$(skopeo inspect --no-tags \
            docker://i.anatase.org/anatase:x86_64 \
            | jq -r '.Labels["org.opencontainers.image.version"] // empty')
          if [[ -z "$version" ]]; then
            echo "x86_64 image has no version label" >&2
            exit 1
          fi

          include_arm=false
          if arm_info=$(skopeo inspect --no-tags \
              docker://i.anatase.org/anatase:aarch64 2>/dev/null); then
            include_arm=true
            arm_version=$(jq -r \
              '.Labels["org.opencontainers.image.version"] // empty' \
              <<< "$arm_info")
          elif [[ "$ARM_ENABLED" == "true" ]]; then
            echo "The requested aarch64 image was not published" >&2
            exit 1
          fi

          if [[ "$ARM_ENABLED" == "true" ]]; then
            if [[ "$arm_version" != "$version" ]]; then
              echo "Architecture image versions differ: x86_64=$version aarch64=$arm_version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "include_arm=$include_arm" >> "$GITHUB_OUTPUT"

      - name: Preflight Git tag
        id: git_tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          error_file="$RUNNER_TEMP/git-tag-error"
          if existing=$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
              --jq '.object.sha' 2>"$error_file"); then
            :
          elif grep -q '(HTTP 404)' "$error_file"; then
            existing=""
          else
            cat "$error_file" >&2
            exit 1
          fi
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "Git tag $VERSION already points to $existing" >&2
            exit 1
          fi
          if [[ "$existing" == "$GITHUB_SHA" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OCI image index
        env:
          INCLUDE_ARM: ${{ steps.image.outputs.include_arm }}
          LUDOS_S3_API: ${{ secrets.LUDOS_S3_API }}
          LUDOS_S3_KEY: ${{ secrets.LUDOS_S3_KEY }}
          LUDOS_S3_SECRET: ${{ secrets.LUDOS_S3_SECRET }}
          LUDOS_COSIGN_KEY: ${{ secrets.LUDOS_COSIGN_KEY }}
          LUDOS_COSIGN_CERT: ${{ secrets.LUDOS_COSIGN_CERT }}
        run: |
          sources=(--source-tag x86_64)
          tags=(--tag "$LUDOS_CHANNEL")
          if [[ "$INCLUDE_ARM" == "true" ]]; then
            sources+=(--source-tag aarch64)
          fi
          if [[ "$LUDOS_CHANNEL" == "rolling" ]]; then
            tags+=(--tag latest)
          fi
          venv/bin/ludos registry oci index anatase \
            "${tags[@]}" "${sources[@]}"

      - name: Create Git tag
        if: ${{ steps.git_tag.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="$GITHUB_SHA"
