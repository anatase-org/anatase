name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
  packages: write

concurrency:
  group: build

jobs:
  build:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.orchestration.outputs.manifest }}
      builds: ${{ steps.orchestration.outputs.builds }}
      images: ${{ steps.orchestration.outputs.images }}
      flatpaks: ${{ steps.orchestration.outputs.flatpaks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Install ludos
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          pushd ludos
          ../venv/bin/pip install -r requirements.txt
          popd

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Initialize Orchestrator & Repos
        run: |
          # Derive dist from main image
          venv/bin/ludos ci env anatase.yml i.anatase.org/anatase:stable
          venv/bin/ludos ci init anatase.yml # add more later

      - name: Prepare CI build manifest
        id: orchestration
        run: |
          venv/bin/ludos ci prepare anatase.yml

          # Emit metadata for follow-ups
          venv/bin/python -c \
            'import json, yaml; print(json.dumps(yaml.safe_load(open("cache/ci/build.yml"))))' \
            > cache/ci/build.json
          {
            echo "manifest=$(<cache/ci/build.yml.encoded)"
            echo "builds=$(jq -c '.builds | keys' cache/ci/build.json)"
            echo "images=$(jq -c '.images | keys' cache/ci/build.json)"
            echo "flatpaks=$(jq -c '.flatpaks | length > 0' cache/ci/build.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Seed CI images
        run: |
          status=0
          venv/bin/ludos ci seed --autoremove || status=$?
          if (( status == 0 )); then
            exit 0
          fi
          if (( status != 7 )); then
            exit "$status"
          fi

          echo Saving space due to insufficient size
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

          venv/bin/ludos ci seed --autoremove

  packages:
    name: Build Packages
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.build.outputs.builds) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Install ludos
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          pushd ludos
          ../venv/bin/pip install -r requirements.txt
          popd

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Restore CI build manifest
        env:
          CI_BUILD_MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          mkdir -p cache/ci
          printf '%s' "$CI_BUILD_MANIFEST" > cache/ci/build.yml.encoded
          base64 --decode cache/ci/build.yml.encoded \
            | xz --decompress > cache/ci/build.yml

      - name: Build package image
        run: venv/bin/ludos ci build "${{ matrix.build }}"

  images:
    name: Build Images
    needs:
      - build
      - packages
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        (needs.packages.result == 'success' || needs.packages.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.build.outputs.images) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Install ludos
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          pushd ludos
          ../venv/bin/pip install -r requirements.txt
          popd

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Restore CI build manifest
        env:
          CI_BUILD_MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          mkdir -p cache/ci
          printf '%s' "$CI_BUILD_MANIFEST" > cache/ci/build.yml.encoded
          base64 --decode cache/ci/build.yml.encoded \
            | xz --decompress > cache/ci/build.yml

      - name: Build final image
        run: venv/bin/ludos ci build "${{ matrix.image }}"

  flatpaks:
    name: Build Flatpaks
    needs:
      - build
      - packages
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        (needs.packages.result == 'success' || needs.packages.result == 'skipped') &&
        needs.build.outputs.flatpaks == 'true'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Install ludos
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          pushd ludos
          ../venv/bin/pip install -r requirements.txt
          popd

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Restore CI build manifest
        env:
          CI_BUILD_MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          mkdir -p cache/ci
          printf '%s' "$CI_BUILD_MANIFEST" > cache/ci/build.yml.encoded
          base64 --decode cache/ci/build.yml.encoded \
            | xz --decompress > cache/ci/build.yml

      - name: Build flatpaks
        run: venv/bin/ludos ci build --flatpaks --autoremove
