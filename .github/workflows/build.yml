name: Build Anatase

on:
  schedule:
    - cron: "5 0 * * 1"
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Refresh Cache
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
      - testing
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'
      - '*.md'
      - 'LICENSE'
      - 'COPYIRIGHT'
      - '.gitignore'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  LUDOS_CHANNEL: ${{ github.ref_name == 'testing' && 'testing' || 'rolling' }}
  LUDOS_INTERIM_PREFIX: ${{ github.ref_name == 'testing' && 'testing-' || '' }}

concurrency:
  group: build-${{ github.ref_name == 'testing' && 'testing' || 'rolling' }}
  queue: single

jobs:
  x86:
    name: Build x86_64
    uses: ./.github/workflows/build-reusable.yml
    with:
      arch: x86_64
      refresh_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_cache || false }}
      release_outputs: ${{ github.event_name != 'schedule' }}
    secrets: inherit

  arm:
    name: Build aarch64
    uses: ./.github/workflows/build-reusable.yml
    with:
      arch: aarch64
      refresh_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_cache || false }}
      release_outputs: ${{ github.event_name != 'schedule' }}
    secrets: inherit

  publish:
    name: Publish multi-platform images
    environment: prod
    outputs:
      anatase: ${{ steps.image.outputs.anatase }}
    needs:
      - x86
      - arm
    if: >-
      ${{
        (!cancelled()) &&
        github.event_name != 'schedule' &&
        needs.x86.result == 'success' &&
        needs.arm.result == 'success' &&
        (needs.x86.outputs.images != '[]' || needs.arm.outputs.images != '[]')
        }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 100
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Install ludos
        run: ./ludos/prepare.sh images

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token

      - name: Validate publication inputs
        id: image
        env:
          X86_IMAGES: ${{ needs.x86.outputs.images }}
          ARM_IMAGES: ${{ needs.arm.outputs.images }}
        run: venv/bin/python .github/image-release.py build

      - name: Generate changelog
        if: ${{ steps.image.outputs.anatase == 'true' }}
        run: |
          if ! skopeo --override-arch amd64 inspect --no-tags \
              "docker://i.anatase.org/anatase:$LUDOS_CHANNEL" \
              > previous-channel.json; then
            echo "No existing $LUDOS_CHANNEL image; skipping changelog"
            : > changelog.md
            exit 0
          fi
          skopeo inspect --no-tags \
            "docker://i.anatase.org/anatase:${LUDOS_INTERIM_PREFIX}x86_64" \
            > current-x86_64.json
          previous_aarch64=-
          if skopeo --override-arch arm64 inspect --no-tags \
              "docker://i.anatase.org/anatase:$LUDOS_CHANNEL" \
              > previous-aarch64.json; then
            previous_aarch64=previous-aarch64.json
          else
            echo "No previous $LUDOS_CHANNEL aarch64 image; omitting its package comparison"
          fi
          skopeo inspect --no-tags \
            "docker://i.anatase.org/anatase:${LUDOS_INTERIM_PREFIX}aarch64" \
            > current-aarch64.json
          venv/bin/python .github/changelog.py \
            previous-channel.json current-x86_64.json \
            --image-name x86_64 \
            --image aarch64 "$previous_aarch64" current-aarch64.json \
            --channel "$LUDOS_CHANNEL" > changelog.md

      - name: Publish OCI image indexes
        env:
          LUDOS_S3_API: ${{ secrets.LUDOS_S3_API }}
          LUDOS_S3_KEY: ${{ secrets.LUDOS_S3_KEY }}
          LUDOS_S3_SECRET: ${{ secrets.LUDOS_S3_SECRET }}
          LUDOS_COSIGN_KEY: ${{ secrets.LUDOS_COSIGN_KEY }}
          LUDOS_COSIGN_CERT: ${{ secrets.LUDOS_COSIGN_CERT }}
        run: |
          sources=(
            --source-tag "${LUDOS_INTERIM_PREFIX}x86_64"
            --source-tag "${LUDOS_INTERIM_PREFIX}aarch64"
          )
          tags=(--tag "$LUDOS_CHANNEL")
          if [[ "$LUDOS_CHANNEL" == "rolling" ]]; then
            tags+=(--tag latest)
          fi
          while IFS= read -r image; do
            venv/bin/ludos registry oci index "$image" \
              "${tags[@]}" "${sources[@]}"
          done < <(jq -r '.[].name' publish-images.json)

      - name: Archive image manifests
        env:
          LUDOS_S3_API: ${{ secrets.LUDOS_S3_API }}
          LUDOS_S3_KEY: ${{ secrets.LUDOS_S3_KEY }}
          LUDOS_S3_SECRET: ${{ secrets.LUDOS_S3_SECRET }}
          LUDOS_GPG_CERT: ${{ secrets.LUDOS_GPG_CERT }}
          LUDOS_GPG_KEY: ${{ secrets.LUDOS_GPG_KEY }}
        run: |
          while IFS=$'\t' read -r image version; do
            skopeo --override-arch amd64 inspect --no-tags \
              "docker://i.anatase.org/$image:$LUDOS_CHANNEL" \
              > "$image-manifest.json"
            venv/bin/ludos registry file upload \
              "$image-manifest.json" \
              "releases/$image/$LUDOS_CHANNEL/$version.json" \
              "$version.json" \
              --sign
          done < <(jq -r '.[] | [.name, .version] | @tsv' publish-images.json)

      - name: Create GitHub prerelease
        if: ${{ steps.image.outputs.anatase == 'true' }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          channel_title="${LUDOS_CHANNEL^}"
          release_tag="$VERSION"
          gh release create "$release_tag" \
            --target "$GITHUB_SHA" \
            --title "$VERSION: $channel_title Release" \
            --notes-file changelog.md \
            --prerelease
          release_url=$(gh release view "$release_tag" --json url --jq '.url')
          echo "url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Announce prerelease on Discord
        if: ${{ steps.image.outputs.anatase == 'true' }}
        env:
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ROLLING }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_ROLLING_THREAD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          .github/discord-notify.sh \
            "$LUDOS_CHANNEL" "$VERSION" "$RELEASE_URL"


  iso:
    name: Build ISOs and ARM disk image
    needs: publish
    if: ${{ needs.publish.outputs.anatase == 'true' }}
    uses: ./.github/workflows/build-iso.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit
