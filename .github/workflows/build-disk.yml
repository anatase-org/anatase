name: Build Anatase ARM Disk

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Skip Disk Upload
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-arm-disk

jobs:
  disk:
    name: Build aarch64 Disk
    runs-on: ubuntu-26.04-arm
    environment: "prod"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          token: ${{ secrets.ANATASE_READ }}
          persist-credentials: false
          submodules: recursive

      - name: Install ludos
        run: ./ludos/prepare.sh images

      - name: Save Storage Space
        run: |
          echo Saving space due to insufficient size
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

      - name: Resolve stable ARM image
        id: image
        run: |
          stable_ref=docker://i.anatase.org/anatase:stable
          podman pull --quiet --platform linux/arm64 "$stable_ref"
          digest=$(podman image inspect i.anatase.org/anatase:stable \
            --format '{{.Digest}}')

          image_ref="docker://i.anatase.org/anatase@${digest}"
          image_info=$(skopeo inspect --override-arch arm64 --no-tags "$image_ref")
          version=$(jq -r \
            '.Labels["org.opencontainers.image.version"] // empty' \
            <<< "$image_info")
          if [[ -z "$version" ]]; then
            echo "Stable ARM image has no version label" >&2
            exit 1
          fi

          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ARM disk
        env:
          SOURCE_REF: ${{ steps.image.outputs.ref }}
        run: |
          venv/bin/ludos bootc disk anatase.yml "$SOURCE_REF" \
            --arch aarch64 \
            --target-ref docker://i.anatase.org/anatase:stable \
            --compress

      - name: Authenticate to Google Cloud
        if: ${{ !inputs.draft }}
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token

      - name: Set up Google Cloud SDK
        if: ${{ !inputs.draft }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Upload ARM disk
        if: ${{ !inputs.draft }}
        env:
          VERSION: ${{ steps.image.outputs.version }}
          LUDOS_S3_API: ${{ secrets.LUDOS_S3_API }}
          LUDOS_S3_KEY: ${{ secrets.LUDOS_S3_KEY }}
          LUDOS_S3_SECRET: ${{ secrets.LUDOS_S3_SECRET }}
          LUDOS_GPG_KEY: ${{ secrets.LUDOS_GPG_KEY }}
          LUDOS_GPG_CERT: ${{ secrets.LUDOS_GPG_CERT }}
        run: |
          venv/bin/ludos registry file upload \
            ./cache/disk/anatase-f44-aarch64/disk.img.gz \
            disk/anatase-aarch64.img.gz \
            "anatase-${VERSION}-aarch64.img.gz" --sign
