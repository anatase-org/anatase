version: 1

flatpak:
  id: org.anatase.Calculator
  command: kcalc
  rename: Calculator (KCalc)
  rename-desktop-file: org.kde.kcalc.desktop
  rename-appdata-file: org.kde.kcalc.appdata.xml
  rename-icon: accessories-calculator
  finish-args: |-
    --device=dri
    --share=ipc
    --socket=fallback-x11
    --socket=wayland
    --filesystem=xdg-config/kdeglobals:ro
    --talk-name=org.kde.kconfig.notify
    --talk-name=org.kde.KGlobalSettings

build-deps:
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - flatpak-rpm-macros
  - ccache

specs:
  - spec: git+https://src.fedoraproject.org/rpms/libmpc:libmpc.spec#branch=f$releasever
    packages:
      - libmpc
  - spec: git+https://src.fedoraproject.org/rpms/kcalc:kcalc.spec#branch=f$releasever
    packages:
      - kcalc
