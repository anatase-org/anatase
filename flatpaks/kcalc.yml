version: 1

flatpak:
  id: org.anatase.Calculator
  command: kcalc
  rename: Calculator (KCalc)
  rename-author: "%s (packaged by Anatase)"
  rename-desktop-file: org.kde.kcalc.desktop
  rename-appdata-file: org.kde.kcalc.appdata.xml
  rename-icon: accessories-calculator
  finish-args: |-
    --device=dri
    --share=ipc
    --socket=fallback-x11
    --socket=wayland
    --filesystem=xdg-config/kdeglobals:ro
    --talk-name=org.kde.kconfig.notify
    --talk-name=org.kde.KGlobalSettings

build-deps:
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - flatpak-rpm-macros
  - ccache

specs:
  - spec: kde/libmpc/libmpc.spec
    files:
      - enge.gpg
      - gating.yaml
      - libmpc.rpmlintrc
      - libmpc.spec
      - plans/ci.fmf
    packages:
      - libmpc
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/libmpc
      branch: f$releasever
  - spec: kde/kcalc/kcalc.spec
    files:
      - kcalc-4.9.90-misc.patch
      - kcalc.spec
    packages:
      - kcalc
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/kcalc
      branch: f$releasever
