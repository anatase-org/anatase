version: 1

flatpak:
  id: org.anatase.DocumentViewer
  command: okular
  rename: Document Viewer (Okular)
  rename-author: "%s (packaged by Anatase)"
  rename-desktop-file: org.kde.okular.desktop
  rename-appdata-file: org.kde.okular.appdata.xml
  rename-icon: okular
  finish-args: |-
    --device=dri
    --filesystem=host
    --share=ipc
    --share=network
    --socket=cups
    --socket=fallback-x11
    --socket=wayland
    --socket=pulseaudio
    --filesystem=xdg-config/kdeglobals:ro
    --filesystem=xdg-run/speech-dispatcher
    --system-talk-name=org.freedesktop.UDisks2
    --talk-name=org.kde.kconfig.notify
    --talk-name=org.kde.KGlobalSettings

build-deps:
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - flatpak-rpm-macros
  - ccache

postprocess: |-
  sed -i -e 's|%i -qwindowtitle %c||' app/share/applications/*
  for f in app/share/applications/okularApplication_*; do
      [ -e "$f" ] || continue
      mv "$f" "${f/okularApplication_/org.kde.okular-}"
  done

specs:
  - spec: kde/okular/okular.spec
    files:
      - okular.spec
    packages:
      - okular
      - okular-part
      - okular-libs
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/okular
      branch: f$releasever
  - spec: kde/calligra/calligra.spec
    files:
      - calligra-disable_products.patch
      - calligra.spec
    packages:
      - calligra-okular-odpgenerator
      - calligra-okular-odtgenerator
      - calligra-stage-libs
      - calligra-words-libs
      - calligra-libs
      - calligra-data
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/calligra
      branch: f$releasever
