version: 1

flatpak:
  id: org.anatase.DiskUsageAnalyzer
  command: filelight
  rename: Disk Usage Analyzer (Filelight)
  rename-author: "%s (packaged by Anatase)"
  rename-desktop-file: org.kde.filelight.desktop
  rename-appdata-file: org.kde.filelight.appdata.xml
  rename-icon: filelight
  finish-args: |-
    --device=dri
    --filesystem=host:ro
    --share=ipc
    --socket=fallback-x11
    --socket=wayland
    --filesystem=xdg-config/kdeglobals:ro
    --talk-name=org.kde.kconfig.notify
    --talk-name=org.kde.KGlobalSettings

build-deps:
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - flatpak-rpm-macros
  - ccache

specs:
  - spec: kde/filelight/filelight.spec
    files:
      - filelight.spec
    packages:
      - filelight
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/filelight
      branch: f$releasever
