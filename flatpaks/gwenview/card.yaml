version: 1

flatpak:
  id: org.anatase.ImageViewer
  command: gwenview
  rename: Image Viewer (Gwenview)
  rename-author: "%s (packaged by Anatase)"
  rename-desktop-file: org.kde.gwenview.desktop
  rename-appdata-file: org.kde.gwenview.appdata.xml
  rename-icon: gwenview
  finish-args: |-
    --device=dri
    --filesystem=host
    --filesystem=xdg-cache/thumbnails:rw
    --filesystem=xdg-data/Trash
    --share=ipc
    --socket=cups
    --socket=fallback-x11
    --socket=pulseaudio
    --socket=wayland
    --filesystem=xdg-config/kdeglobals:ro
    --talk-name=org.kde.kconfig.notify
    --talk-name=org.kde.KGlobalSettings

build-deps:
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - flatpak-rpm-macros
  - ccache

specs:
  - spec: git+https://src.fedoraproject.org/rpms/cfitsio:cfitsio.spec#branch=f$releasever
    packages:
      - cfitsio
  - spec: git+https://src.fedoraproject.org/rpms/kcolorpicker:kcolorpicker.spec#branch=f$releasever
    packages:
      - kcolorpicker-qt6
  - spec: git+https://src.fedoraproject.org/rpms/kimageannotator:kimageannotator.spec#branch=f$releasever
    packages:
      - kimageannotator-common
      - kimageannotator-qt6
  - spec: git+https://src.fedoraproject.org/rpms/gwenview:gwenview.spec#branch=f$releasever
    packages:
      - gwenview
      - gwenview-libs
