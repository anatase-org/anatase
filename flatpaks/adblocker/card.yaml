version: 1

env:
  version: $version

flatpak:
  id: org.anatase.Browser.Adblocker
  runtime: true
  version: "1"

build-deps:
  - curl
  - findutils
  - gawk
  - git-core
  - gzip
  - jq
  - openssl
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - tar

prepare: |
  set -eux

  #
  # Prepare ublock source
  #
  UBLOCK_REF="1.74.0"
  WEEK_MINUTES="$(( ($(date -u +%u) - 1) * 1440 + $(date -u +%-H) * 60 + $(date -u +%-M) ))"
  PACKAGE_VERSION="${version}.${WEEK_MINUTES}"
  SOURCE="uBlock-source.tar.gz"
  SOURCE_CACHE="uBlock-source-${UBLOCK_REF}.tar.gz"
  SOURCE_DIR="uBlock-source"
  RULESETS="rulesets-${PACKAGE_VERSION}.tar.gz"
  RULESETS_CACHE="rulesets-${UBLOCK_REF}-${PACKAGE_VERSION}-trusted-v1.tar.gz"

  sed -i -E "0,/^Version:[[:space:]]*.*/s//Version:        ${PACKAGE_VERSION}/" adblocker.spec
  mkdir -p /cache/artifacts

  if [ -f "/cache/artifacts/${SOURCE_CACHE}" ]; then
    cp -f "/cache/artifacts/${SOURCE_CACHE}" "$SOURCE"
  else
    rm -rf "$SOURCE_DIR"
    git clone \
      --depth=1 \
      --filter=blob:none \
      --also-filter-submodules \
      --recurse-submodules \
      --shallow-submodules \
      --branch "$UBLOCK_REF" \
      https://github.com/gorhill/uBlock.git "$SOURCE_DIR"
    find "$SOURCE_DIR" -name .git -prune -exec rm -rf {} +
    tar -czf "$SOURCE" "$SOURCE_DIR"
    cp -f "$SOURCE" "/cache/artifacts/${SOURCE_CACHE}"
  fi

  if [ -f "/cache/artifacts/${RULESETS_CACHE}" ]; then
    cp -f "/cache/artifacts/${RULESETS_CACHE}" "$RULESETS"
    exit 0
  fi

  if [ ! -d "$SOURCE_DIR" ]; then
    tar -xzf "$SOURCE"
  fi

  #
  # Prepare rulesets
  #

  rm -rf rulesets
  mkdir -p rulesets/chromium
  # The compiler must use the same secret to recognize our trust markers.
  secret="$(openssl rand -hex 8)"
  printf '%s' "$secret" > rulesets/secret.txt
  jq -c '.[] | select(.enabled == true) | select(((.excludedPlatforms // []) | index("chromium")) | not)' \
    "$SOURCE_DIR/platform/mv3/rulesets.json" |
  while IFS= read -r ruleset; do
    id="$(printf '%s\n' "$ruleset" | jq -r '.id')"
    trusted="$(printf '%s\n' "$ruleset" | jq -r '.trusted == true')"
    urls="$(printf '%s\n' "$ruleset" | jq -r '.urls[]?')"
    if [ -z "$urls" ]; then
      continue
    fi
    : > "rulesets/chromium/$id"
    printf '%s\n' "$urls" |
    while IFS= read -r url; do
      # Match upstream fetchList's trusted asset / trusted URL checks.
      url_trusted="$trusted"
      case "$url" in
        https://ublockorigin.github.io/uAssets/filters/*) url_trusted=true ;;
      esac
      if [ "$url_trusted" = true ]; then
        printf '!#trusted on %s\n' "$secret" >> "rulesets/chromium/$id"
      fi
      curl -fL --retry 3 --retry-delay 2 "$url" >> "rulesets/chromium/$id"
      printf '\n!#trusted off %s\n' "$secret" >> "rulesets/chromium/$id"
    done
  done
  tar -czf "$RULESETS" rulesets
  cp -f "$RULESETS" "/cache/artifacts/${RULESETS_CACHE}"
  rm -rf "$SOURCE_DIR" rulesets

specs:
  - spec: adblocker.spec
    replace:
      Version: $version
    patch:
      type: git
      url: https://github.com/gorhill/uBlock.git
      ref: 1.74.0
      file: overrides.patch
    packages:
      - anatase-browser-adblocker
    files:
      - adblocker.spec
      - adblocker.pem
      - adblocker.svg
      - adblocker_off.svg
      - org.anatase.Browser.Adblocker.metainfo.xml
      - overrides.patch
