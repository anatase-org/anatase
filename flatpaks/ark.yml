version: 1

flatpak:
  id: org.anatase.ArchiveManager
  command: ark
  rename: Archive Manager (Ark)
  rename-author: "%s (packaged by Anatase)"
  rename-desktop-file: org.kde.ark.desktop
  rename-appdata-file: org.kde.ark.appdata.xml
  rename-icon: ark
  finish-args: |-
    --device=dri
    --filesystem=host
    --share=ipc
    --socket=wayland
    --socket=x11
    --filesystem=xdg-config/kdeglobals:ro
    --talk-name=org.kde.kconfig.notify
    --talk-name=org.kde.KGlobalSettings

build-deps:
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - flatpak-rpm-macros
  - ccache

specs:
  - spec: kde/ark/ark.spec
    files:
      - ark.spec
    packages:
      - ark
      - ark-libs
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/ark
      branch: f$releasever
  - spec: kde/gwenview/gwenview.spec
    files:
      - gwenview.spec
    packages:
      - gwenview-libs
  - spec: kde/markdownpart/markdownpart.spec
    files:
      - markdownpart.spec
    packages:
      - markdownpart
  - spec: kde/okular/okular.spec
    files:
      - e322356cd1b5fae4fb71ff61b248fcb352d189cb.patch
      - okular.spec
    packages:
      - okular-part
      - okular-libs
  - spec: kde/svgpart/svgpart.spec
    files:
      - svgpart.spec
    packages:
      - svgpart
