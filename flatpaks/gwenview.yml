version: 1

flatpak:
  id: org.anatase.ImageViewer
  command: gwenview
  rename: Image Viewer (Gwenview)
  rename-author: "%s (packaged by Anatase)"
  rename-desktop-file: org.kde.gwenview.desktop
  rename-appdata-file: org.kde.gwenview.appdata.xml
  rename-icon: gwenview
  finish-args: |-
    --device=dri
    --filesystem=host
    --filesystem=xdg-cache/thumbnails:rw
    --filesystem=xdg-data/Trash
    --share=ipc
    --socket=cups
    --socket=fallback-x11
    --socket=pulseaudio
    --socket=wayland
    --filesystem=xdg-config/kdeglobals:ro
    --talk-name=org.kde.kconfig.notify
    --talk-name=org.kde.KGlobalSettings

build-deps:
  - rpm-build
  - rpmdevtools
  - redhat-rpm-config
  - flatpak-rpm-macros
  - ccache

specs:
  - spec: kde/cfitsio/cfitsio.spec
    files:
      - cfitsio-noversioncheck.patch
      - cfitsio.spec
    packages:
      - cfitsio
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/cfitsio
      branch: f$releasever
  - spec: kde/kcolorpicker/kcolorpicker.spec
    files:
      - kcolorpicker.spec
    packages:
      - kcolorpicker-qt6
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/kcolorpicker
      branch: f$releasever
  - spec: kde/kimageannotator/kimageannotator.spec
    files:
      - kimageannotator.spec
    packages:
      - kimageannotator-common
      - kimageannotator-qt6
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/kimageannotator
      branch: f$releasever
  - spec: kde/gwenview/gwenview.spec
    files:
      - gwenview.spec
    packages:
      - gwenview
      - gwenview-libs
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/gwenview
      branch: f$releasever
