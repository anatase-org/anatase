version: 1

env:
  releasever: 44
  nvidia: "610.43.02"

distro: f$releasever
orchestrator: quay.io/fedora/fedora:$releasever

repos:
  - repo: fedora
    priority: 10
    releasever: $releasever
    basearch: $arch
  - repo: fedora-updates
    priority: 20
    releasever: $releasever
    basearch: $arch

bootstrap: cards/bootstrap.yml

cards:
  - cards/base
  - cards/base/utils
  - cards/base/kernel
  - cards/base/grub
  - cards/base/firmware
  - cards/base/atomic
  - cards/base/virt
  - cards/drivers/nvidia/nvidia
  - cards/drivers/nvidia/nct
  - cards/de/kde

labels:
  org.opencontainers.image.title: Anatase
  org.opencontainers.image.source: https://github.com/anatase-org/anatase
  org.opencontainers.image.description: Anatase distribution built with Ludos.
