version: 1

env:
  releasever: 44

distro: f$releasever
bootstrap: quay.io/fedora/fedora:$releasever

repos:
  - repo: fedora
    priority: 10
    releasever: $releasever
    basearch: $arch
  - repo: fedora-updates
    priority: 20
    releasever: $releasever
    basearch: $arch
cards:
  - cards/base
  - cards/base/kernel
  - cards/base/grub
  - cards/base/firmware
  - cards/base/atomic
  - cards/de/kde

labels:
  org.opencontainers.image.title: Anatase
  org.opencontainers.image.source: https://github.com/anatase-org/anatase
  org.opencontainers.image.description: Anatase distribution built with Ludos.
