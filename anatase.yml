version: 1
env:
  releasever: 44
  dist: ""
  tag: $releasever.$version$dist

name: Anatase
releasever: $releasever
distro: f$releasever-$arch

orchestrator: quay.io/fedora/fedora:$releasever
orchestrator-deps:
  # Required for rpmbuild deps to resolve correctly
  # particularly in mesa
  - redhat-rpm-config
  - cargo-rpm-macros
  # Tooling for local checks
  - rust
  - cargo
  - rpm-build
  - rpmdevtools
  - ripgrep
  - python3

repos:
  - repo: fedora
    priority: 20
    releasever: $releasever
    basearch: $arch
  - repo: fedora-updates
    priority: 10
    releasever: $releasever
    basearch: $arch

bootstrap: cards/bootstrap.yml

cards:
  - cards/base/kernel
  - cards/base/firmware
  - cards/drivers/mesa # mesa is required by base packages
  - cards/drivers/mesa/lib32
  - cards/base/identity # fedora-logos is pulled by base
  - cards/base/base
  - cards/base/grub
  - cards/base/utils
  - cards/base/atomic
  - cards/base/virt
  - cards/base/scx
  - cards/drivers/nvidia/nvidia
  - cards/drivers/nvidia/nct
  - cards/de/kde
  - cards/gaming/gamemode
  - cards/gaming/hhd
  - cards/base/tweaks

installer:
  ostree: True
  files:
    - installer/anaconda.conf
    - installer/anatase.ks
    - installer/anatase-webui.desktop
    - installer/build.sh
  build: |
    /usr/bin/bash /files/installer/build.sh

labels:
  org.opencontainers.image.title: Anatase
  org.opencontainers.image.source: https://github.com/anatase-org/anatase
  org.opencontainers.image.description: Anatase distribution built with Ludos.
  org.opencontainers.image.version: $tag
