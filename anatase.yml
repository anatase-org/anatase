version: 1
env:
  releasever: 44
  nvidia: "610.43.02"

releasever: $releasever
distro: f$releasever-$arch
orchestrator: quay.io/fedora/fedora:$releasever
orchestrator-deps:
  # Required for rpmbuild deps to resolve correctly
  # particularly in mesa
  - redhat-rpm-config
  - cargo-rpm-macros

repos:
  - repo: fedora
    priority: 10
    releasever: $releasever
    basearch: $arch
  - repo: fedora-updates
    priority: 20
    releasever: $releasever
    basearch: $arch

bootstrap: cards/bootstrap.yml

cards:
  - cards/base/kernel
  - cards/base/firmware
  - cards/drivers/mesa # mesa is required by base packages
  - cards/drivers/mesa/lib32
  - cards/base/base
  - cards/base/grub
  - cards/base/utils
  - cards/base/atomic
  - cards/base/virt
  - cards/drivers/nvidia/nvidia
  - cards/drivers/nvidia/nct
  - cards/de/kde

labels:
  org.opencontainers.image.title: Anatase
  org.opencontainers.image.source: https://github.com/anatase-org/anatase
  org.opencontainers.image.description: Anatase distribution built with Ludos.
