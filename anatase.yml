version: 1
env:
  releasever: 44
  dist: ""
  tag: $version$dist

name: Anatase
releasever: $releasever
distro: f$releasever-$arch
tag: $tag

orchestrator: quay.io/fedora/fedora:$releasever
orchestrator-deps:
  # Required for rpmbuild deps to resolve correctly
  # particularly in mesa
  - redhat-rpm-config
  - cargo-rpm-macros
  # Flatpaks
  - appstream-compose

repos:
  - repo: fedora
    priority: 20
    releasever: $releasever
    basearch: $arch
  - repo: fedora-updates
    priority: 10
    releasever: $releasever
    basearch: $arch

bootstrap: cards/bootstrap.yml

cards:
  - cards/base/kernel
  - cards/base/firmware
  - cards/drivers/mesa # mesa is required by base packages
  - cards/drivers/mesa/lib32
  - cards/base/identity # fedora-logos is pulled by base
  - cards/base/base
  - cards/base/grub
  - cards/base/utils
  - cards/base/atomic
  - cards/base/virt
  - cards/base/scx
  - cards/drivers/nvidia/nvidia
  - cards/drivers/nvidia/nct
  - cards/de/kde
  - cards/gaming/gamemode
  - cards/gaming/hhd
  - cards/base/tweaks
  - cards/base/finalize

runtime:
  # DO NOT CHANGE THESE, THEY AFFECT THE UPDATE HASH OF THE RUNTIME.
  id: org.anatase.Platform
  repo: runtime
  branch: stable
  title: Anatase Runtime
  author: Anatase
  description: System runtime used by applications from Anatase
  # Copy freedesktop runtime here.
  # Even though a lot of the packages are not MIT.
  license: MIT
  image: https://flatpaks.anatase.org/icons/128x128/org.anatase.Platform.png

flatpaks:
  - flatpaks/ark
  - flatpaks/filelight
  - flatpaks/gwenview
  - flatpaks/kate
  - flatpaks/kcalc
  - flatpaks/okular
  - flatpaks/steam
  - flatpaks/browser
  - flatpaks/adblocker

installer:
  ostree: True

  flatpaks:
    - repo: anatase
      nodeps: True
      preinstall:
        - org.anatase.ArchiveManager
        - org.anatase.DiskUsageAnalyzer
        - org.anatase.ImageViewer
        - org.anatase.TextEditor
        - org.anatase.Calculator
        - org.anatase.DocumentViewer
        # Codecs, sigh, but this is for end users
        - org.anatase.Browser
        - org.anatase.Browser.Adblocker
      installer:

  files:
    - installer/anaconda.conf
    - installer/anatase-face.png
    - installer/anatase.ks
    - installer/anatase-webui.desktop
    - installer/build.sh
  build: |
    /usr/bin/bash /files/installer/build.sh

labels:
  org.opencontainers.image.title: Anatase
  org.opencontainers.image.source: https://github.com/anatase-org/anatase
  org.opencontainers.image.description: Anatase distribution built with Ludos.
  org.opencontainers.image.version: $tag
