version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  # Crates that need dynamic resolving
  - rust-paste+default-devel
  - rust-rustc-hash+default-devel
  - rust-syn+clone-impls-devel
  - rust-syn+default-devel

packages:
  x86_64:
    - elfutils-libelf.i686
    - expat.i686
    - glibc.i686
    - libX11.i686
    - libX11-xcb.i686
    - libXau.i686
    - libXext.i686
    - libXxf86vm.i686
    - libdisplay-info.i686
    - libdrm.i686
    - libedit.i686
    - libffi.i686
    - libgcc.i686
    - libglvnd.i686
    - libglvnd-egl.i686
    - libglvnd-glx.i686
    - libpciaccess.i686
    - libstdc++.i686
    - libwayland-client.i686
    - libxcb.i686
    - libxml2.i686
    - libxshmfence.i686
    - libzstd.i686
    - llvm-filesystem.i686
    - llvm-libs.i686
    - lm_sensors-libs.i686
    - ncurses-libs.i686
    - spirv-tools-libs.i686
    - systemd-libs.i686
    - vulkan-loader.i686
    - xz-libs.i686
    - zlib-ng-compat.i686

specs:
  - spec: ./mesa.spec
    files:
      - Mesa-MLAA-License-Clarification-Email.txt
      - "*.patch"
    packages:
      x86_64:
        - mesa-filesystem.i686
        - mesa-libEGL.i686
        - mesa-libGL.i686
        - mesa-libgbm.i686
        - mesa-dri-drivers.i686
        - mesa-vulkan-drivers.i686

postprocess: |
  set -eux

  #
  # Mesa 32-bit flatpak (Fedora endpoint only)
  #
  flatpak_arch="$(rpm -E '%_arch')"
  fedora_branch="f$(rpm -E '%fedora')"

  if [ "$flatpak_arch" != "x86_64" ] || [ ! -e /usr/lib/libEGL_mesa.so.0 ]; then
      exit 0
  fi

  link_payload_entry() {
      src="$1"
      dst="$2"

      mkdir -p "$(dirname "$dst")"

      if [ -L "$src" ]; then
          target="$(readlink "$src")"
          if [ "${target#/}" != "$target" ]; then
              target="$(realpath -m --relative-to="$(dirname "$src")" "$target")"
          fi
          ln -snf "$target" "$dst"
      elif [ -f "$src" ]; then
          ln "$src" "$dst"
      fi
  }

  link_payload_glob() {
      dst_dir="$1"
      shift

      mkdir -p "$dst_dir"
      for src in "$@"; do
          [ -e "$src" ] || [ -L "$src" ] || continue
          case "${src##*/}" in
              nvidia*|libnvidia*|iHD_drv_video.so) continue ;;
          esac
          link_payload_entry "$src" "$dst_dir/$(basename "$src")"
      done
  }

  rewrite_flatpak_metadata() {
      payload="$1"

      find "$payload" -type f \( -name '*.json' -o -name '*.icd' \) -exec sed -i \
              -e 's|/usr/lib64/||g' \
              -e 's|/usr/lib/||g' \
              {} +
  }

  build_flatpak_payload() {
      libdir="$1"
      payload="$2"
      vulkan_cpu="$3"

      rm -rf "$payload"
      mkdir -p "$payload"

      link_payload_glob "$payload/lib" \
          "$libdir"/libEGL_mesa.so* \
          "$libdir"/libGLX_mesa.so* \
          "$libdir"/libGLX_system.so* \
          "$libdir"/libgbm.so* \
          "$libdir"/libgallium-*.so \
          "$libdir"/libvulkan_*.so \
          "$libdir"/libVkLayer_MESA_device_select.so

      for rule in \
          "$payload/lib/dri:$libdir/dri/*_dri.so" \
          "$payload/lib/dri:$libdir/dri/nouveau_drv_video.so" \
          "$payload/lib/dri:$libdir/dri/r600_drv_video.so" \
          "$payload/lib/dri:$libdir/dri/radeonsi_drv_video.so" \
          "$payload/lib/dri:$libdir/dri/d3d12_drv_video.so" \
          "$payload/lib/dri:$libdir/dri/virtio_gpu_drv_video.so" \
          "$payload/lib/gbm:$libdir/gbm/dri_gbm.so" \
          "$payload/share/drirc.d:/usr/share/drirc.d/*mesa*.conf" \
          "$payload/share/drirc.d:/usr/share/drirc.d/*radv*.conf" \
          "$payload/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d/*mesa*.json" \
          "$payload/vulkan/icd.d:/usr/share/vulkan/icd.d/*_icd.$vulkan_cpu.json" \
          "$payload/vulkan/implicit_layer.d:/usr/share/vulkan/implicit_layer.d/VkLayer_MESA_device_select.json"
      do
          link_payload_glob "${rule%%:*}" ${rule#*:}
      done

      rewrite_flatpak_metadata "$payload"

      # Sanity check we did not miss libraries
      find "$payload" -type f \( -name '*.json' -o -name '*.icd' \) -print0 |
          xargs -0 -r grep -hoE 'lib[^"[:space:]]+\.so([^"[:space:]]*)?' |
          sort -u |
          while read -r lib; do
              [ -e "$payload/lib/$lib" ] || {
                  printf 'Flatpak Mesa payload is missing metadata-referenced library: %s\n' "$lib" >&2
                  return 1
              }
          done
  }

  build_flatpak_payload /usr/lib /usr/lib/anatase/flatpak/mesa32 i686

  install -dm0755 /usr/lib/anatase/flatpak
  cat >> /usr/lib/anatase/flatpak/mesa.conf <<EOF
  org.fedoraproject.Platform.GL32.default/$flatpak_arch/$fedora_branch /usr/lib/anatase/flatpak/mesa32
  EOF
