version: 1

priority: 8

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  # Crates that need dynamic resolving
  - rust-paste+default-devel
  - rust-rustc-hash+default-devel
  - rust-syn+clone-impls-devel
  - rust-syn+default-devel

specs:
  - spec: ./mesa.spec
    files:
      - Mesa-MLAA-License-Clarification-Email.txt
      - "*.patch"
    packages:
      aarch64:
        - mesa-filesystem
        - mesa-libEGL
        - mesa-libGL
        - mesa-libgbm
        - mesa-dri-drivers
        - mesa-vulkan-drivers
      x86_64:
        - mesa-filesystem
        - mesa-libEGL
        - mesa-libGL
        - mesa-libgbm
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - mesa-filesystem.i686
        - mesa-libEGL.i686
        - mesa-libGL.i686
        - mesa-libgbm.i686
        - mesa-dri-drivers.i686
        - mesa-vulkan-drivers.i686

    # Updater
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/mesa
      branch: rawhide # f$releasever
    patch:
      type: git
      url: https://gitlab.freedesktop.org/mesa/mesa.git
      ref: mesa-${spec:Version}
      file: overrides.patch
