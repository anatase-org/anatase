version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  # Crates that need dynamic resolving
  - rust-paste+default-devel
  - rust-rustc-hash+default-devel
  - rust-syn+clone-impls-devel
  - rust-syn+default-devel

packages:
  - libX11-xcb
  - vulkan-loader
  - libdisplay-info
  - elfutils-libelf
  - expat
  - hwdata
  - libX11
  - libX11-common
  - libXau
  - libXext
  - libXxf86vm
  - libdrm
  - libedit
  - libglvnd
  - libglvnd-egl
  - libglvnd-glx
  - libpciaccess
  - libwayland-client
  - libxcb
  - libxshmfence
  - llvm-filesystem
  - llvm-libs
  - lm_sensors-libs
  - spirv-tools-libs
  # mesa-libOpenCL deps
  - clang-libs
  - libclc
  - opencl-filesystem
  - OpenCL-ICD-Loader
  - spirv-llvm-translator

specs:
  - spec: ./mesa.spec
    files:
      - Mesa-MLAA-License-Clarification-Email.txt
      - "*.patch"
    packages:
      - mesa-filesystem
      - mesa-libEGL
      - mesa-libGL
      - mesa-libOpenCL
      - mesa-libgbm
      - mesa-dri-drivers
      - mesa-vulkan-drivers

    # Updater
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/mesa
      branch: rawhide # f$releasever
    patch:
      type: git
      url: https://gitlab.freedesktop.org/mesa/mesa.git
      ref: mesa-${spec:Version}
      file: overrides.patch
