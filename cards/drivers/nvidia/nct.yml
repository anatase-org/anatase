version: 1

build-deps:
  - bash
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - tar

specs:
  - spec: libnvidia-container.spec
    files:
      - libnvidia-container.spec
    packages:
      - libnvidia-container1
      - libnvidia-container-tools
  - spec: nvidia-container-toolkit.spec
    files:
      - nvidia-container-toolkit.spec
    packages:
      - nvidia-container-toolkit
      - nvidia-container-toolkit-base

files:
  - 60-nvidia-cdi.rules

postprocess: |
  set -eux
  install -Dm0644 /files/60-nvidia-cdi.rules \
      /usr/lib/udev/rules.d/60-nvidia-cdi.rules
  install -dm0755 /usr/lib/systemd/system-preset
  cat > /usr/lib/systemd/system-preset/80-anatase-nvidia-cdi.preset <<'EOF'
  disable nvidia-cdi-refresh.service
  disable nvidia-cdi-refresh.path
  EOF
  systemctl preset nvidia-cdi-refresh.service nvidia-cdi-refresh.path
