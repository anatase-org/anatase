version: 1

packages:
  # Shell and libc runtime
  - bash
  - glibc

  # NVIDIA Container Toolkit runtime libraries
  - elfutils-libelf
  - libcap
  - libseccomp

build-deps:
  # Base
  - bash
  - coreutils
  - dnf5
  - dnf5-plugins
  - findutils
  - gawk
  - grep
  - sed
  - tar
  - which
  - xz

  # NCT
  - fuse-overlayfs
  - gcc
  - podman

hash: >
  @hash(
    nct.yml,
    build-nct.sh,
    nvidia-container-toolkit
  )

prepare: |
  set -eux
  nct_revision="$(git -C nvidia-container-toolkit rev-parse HEAD)"
  nct_version="$(git -C nvidia-container-toolkit describe --tags --exact-match 2>/dev/null || printf '%s' "$nct_revision" | cut -c1-8)"
  echo "nct_revision=$nct_revision" >> "$LUDOS_ENV"
  echo "nct_version=$nct_version" >> "$LUDOS_ENV"

build: |
  set -eux
  REVISION="$nct_revision" VERSION="$nct_version" ./build-nct.sh
