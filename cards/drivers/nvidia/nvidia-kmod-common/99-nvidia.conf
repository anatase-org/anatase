# Include the NVIDIA modules in the generic initramfs. PCI coldplug can then
# load the driver and create its device nodes before switching to the real root.
add_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_peermem nvidia_uvm "

# nvidia-modprobe creates /dev/nvidia* in response to the module uevent, so the
# helper and its rule must be available when the driver loads in the initramfs.
install_items+=" /usr/bin/nvidia-modprobe /usr/lib/udev/rules.d/60-nvidia.rules /usr/lib/modprobe.d/nvidia.conf /etc/modprobe.d/nvidia-modeset.conf "
