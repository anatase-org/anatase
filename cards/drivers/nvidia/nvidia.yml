version: 1

priority: 9

env:
  version: $nvidia

build-deps:
  - git
  - make
  - mock
  - mock-core-configs
  - rpmdevtools
  - wget

hash: >
  $version-@hash(
    build.sh,
    nvidia-driver,
    nvidia-kmod-common,
    nvidia-modprobe,
    nvidia-persistenced,
    nvidia-settings
  )

build: |
  set -eux
  ./build.sh
