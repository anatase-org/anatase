version: 1

priority: 9

env:
  version: $nvidia

packages:
  # libva integration
  - libva-nvidia-driver

  # The rest are transient dependencies

  # Shell and service integration
  - bash
  - systemd

  # Driver runtime libraries
  - cairo
  - gdk-pixbuf2
  - glib2
  - gtk3
  - jansson
  - libtirpc
  - libvdpau
  - pango
  - libwayland-client

  # X11 runtime libraries
  - libX11
  - libXext
  - libXxf86vm

  # GL, EGL, Vulkan, and OpenCL integration
  - egl-gbm
  - egl-wayland2
  - egl-x11
  - libglvnd
  - libglvnd-egl
  - libglvnd-gles
  - libglvnd-glx
  - libglvnd-opengl
  - ocl-icd
  - opencl-filesystem
  - vulkan-loader
  - xorg-x11-server-Xorg

  # SELinux policy scriptlets
  - libselinux-utils

  # 32-bit driver compatibility libraries
  - egl-gbm.i686
  - egl-wayland2.i686
  - egl-x11.i686
  - libX11.i686
  - libXext.i686
  - libglvnd.i686
  - libglvnd-egl.i686
  - libglvnd-gles.i686
  - libglvnd-glx.i686
  - libglvnd-opengl.i686
  - libvdpau.i686
  - vulkan-loader.i686

build-deps:
  - git
  - make
  - mock
  - mock-core-configs
  - rpmdevtools
  - wget

hash: >
  f$releasever-$version-@hash(
    nvidia.yml,
    build.sh,
    nvidia-driver,
    nvidia-driver-selinux,
    nvidia-kmod-common,
    nvidia-modprobe,
    nvidia-persistenced,
    nvidia-settings
  )

build: |
  set -eux
  ./build.sh
