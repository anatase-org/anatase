version: 1

env:
  version: $nvidia

packages:
  # libva integration
  - libva-nvidia-driver

  # The rest are transient dependencies

  # Shell and service integration
  - bash
  - systemd

  # Driver runtime libraries
  - cairo
  - gdk-pixbuf2
  - glib2
  - gtk3
  - jansson
  - libtirpc
  - libvdpau
  - pango
  - libwayland-client

  # X11 runtime libraries
  - libX11
  - libXext
  - libXxf86vm

  # GL, EGL, Vulkan, and OpenCL integration
  - egl-gbm
  - egl-wayland2
  - egl-x11
  - libglvnd
  - libglvnd-egl
  - libglvnd-gles
  - libglvnd-glx
  - libglvnd-opengl
  - ocl-icd
  - opencl-filesystem
  - vulkan-loader
  - xorg-x11-server-Xorg

  # SELinux policy scriptlets
  - libselinux-utils

  # 32-bit driver compatibility libraries
  - egl-gbm.i686
  - egl-wayland2.i686
  - egl-x11.i686
  - libX11.i686
  - libXext.i686
  - libglvnd.i686
  - libglvnd-egl.i686
  - libglvnd-gles.i686
  - libglvnd-glx.i686
  - libglvnd-opengl.i686
  - libvdpau.i686
  - vulkan-loader.i686

build-deps:
  - bash
  - coreutils
  - findutils
  - gawk
  - grep
  - make
  - rpm-build
  - rpmdevtools
  - sed
  - tar
  - wget
  - xz

prepare: |
  set -eux
  VERSION="${version}"
  driver_dir="nvidia-driver"

  mkdir -p /cache/artifacts
  find /cache/artifacts -maxdepth 1 -type f -name 'NVIDIA-*.run' \
    -exec cp -n -t "$driver_dir" {} + || true
  find /cache/artifacts -maxdepth 1 -type f -name '*.tar.xz' \
    -exec cp -n -t "$driver_dir" {} + || true

  if [ "$arch" = "aarch64" ]; then
    driver_arches="aarch64"
  else
    driver_arches="x86_64"
  fi

  have_sources() {
    [ -f "$driver_dir/nvidia-kmod-common-${VERSION}.tar.xz" ] || return 1
    if [ "$arch" = "aarch64" ]; then
      [ -f "$driver_dir/nvidia-driver-${VERSION}-aarch64.tar.xz" ] || return 1
    else
      [ -f "$driver_dir/nvidia-driver-${VERSION}-x86_64.tar.xz" ] || return 1
      [ -f "$driver_dir/nvidia-driver-${VERSION}-i386.tar.xz" ] || return 1
    fi
  }

  if ! have_sources; then
    (cd "$driver_dir" && ARCHES="$driver_arches" VERSION="$VERSION" bash ./nvidia-generate-tarballs.sh)
  fi

  find "$driver_dir" -maxdepth 1 -type f -name 'NVIDIA-*.run' \
    -exec cp -n -t /cache/artifacts {} + || true
  find "$driver_dir" -maxdepth 1 -type f -name '*.tar.xz' \
    -exec cp -n -t /cache/artifacts {} + || true
  cp -f "$driver_dir/nvidia-kmod-common-${VERSION}.tar.xz" nvidia-kmod-common/

specs:
  - spec: nvidia-kmod-common/nvidia-kmod-common.spec
    packages:
      - nvidia-kmod-common
    replace:
      Version: $version
    upstream:
      type: dist-git
      url: https://github.com/negativo17/nvidia-kmod-common

  - spec: nvidia-settings/nvidia-settings.spec
    packages:
      # Keep nvidia-settings so we have it in sync
      # but don't build/install it
      # - nvidia-settings
      # - nvidia-libXNVCtrl
    replace:
      Version: $version
    upstream:
      type: dist-git
      url: https://github.com/negativo17/nvidia-settings

  - spec: nvidia-modprobe/nvidia-modprobe.spec
    packages:
      - nvidia-modprobe
    replace:
      Version: $version
    upstream:
      type: dist-git
      url: https://github.com/negativo17/nvidia-modprobe

  - spec: nvidia-persistenced/nvidia-persistenced.spec
    packages:
      - nvidia-persistenced
    replace:
      Version: $version
    upstream:
      type: dist-git
      url: https://github.com/negativo17/nvidia-persistenced

  - spec: nvidia-driver/nvidia-driver.spec
    packages:
      aarch64:
        - nvidia-driver
        - nvidia-driver-libs
        - nvidia-driver-cuda
        - nvidia-driver-cuda-libs
        - nvidia-driver-common
        - libnvidia-fbc
        - xorg-x11-nvidia
      x86_64:
        - nvidia-driver
        - nvidia-driver-libs
        - nvidia-driver-cuda
        - nvidia-driver-cuda-libs
        - nvidia-driver-common
        - libnvidia-fbc
        - xorg-x11-nvidia
        - nvidia-driver-libs.i686
        - nvidia-driver-cuda-libs.i686
        - nvidia-driver-common.i686
        - libnvidia-fbc.i686
    replace:
      Version: $version
    upstream:
      type: dist-git
      url: https://github.com/negativo17/nvidia-driver

  - spec: nvidia-driver-selinux/nvidia-driver-selinux.spec
    packages:
      - nvidia-driver-selinux
    upstream:
      type: dist-git
      url: https://github.com/negativo17/nvidia-driver-selinux

postprocess: |
  set -eux

  # Drop Nouveau's ICD JSON files to force using nvidia.
  rm -f /usr/share/vulkan/icd.d/nouveau_icd.*.json

  # Some NVML consumers dlopen the unversioned name, add a symlink.
  if [ -e /usr/lib64/libnvidia-ml.so.1 ]; then
      ln -snf libnvidia-ml.so.1 /usr/lib64/libnvidia-ml.so
  fi

  #
  # Nvidia flatpak (avoids breaking flatpaks when rebooting/on live ISO)
  #
  driver_version="$(rpm -q --qf '%{VERSION}' nvidia-driver)"
  driver_version_dashed="$(printf '%s' "$driver_version" | tr . -)"
  flatpak_arch="$(rpm -E '%_arch')"
  fedora_branch="f$(rpm -E '%fedora')"

  link_payload_entry() {
      src="$1"
      dst="$2"

      mkdir -p "$(dirname "$dst")"

      if [ -L "$src" ]; then
          target="$(readlink "$src")"
          if [ "${target#/}" != "$target" ]; then
              target="$(realpath -m --relative-to="$(dirname "$src")" "$target")"
          fi
          ln -snf "$target" "$dst"
      elif [ -f "$src" ]; then
          ln "$src" "$dst"
      fi
  }

  link_payload_glob() {
      dst_dir="$1"
      shift

      mkdir -p "$dst_dir"
      for src in "$@"; do
          [ -e "$src" ] || [ -L "$src" ] || continue
          case "${src##*/}" in
              libnvidia-container*.so*) continue ;;
          esac
          link_payload_entry "$src" "$dst_dir/$(basename "$src")"
      done
  }

  rewrite_flatpak_metadata() {
      payload="$1"

      find "$payload" -type f \( -name '*.json' -o -name '*.icd' \) -exec sed -i \
              -e 's|/usr/lib64/||g' \
              -e 's|/usr/lib/||g' \
              -e 's|__NV_VK_ICD__|libGLX_nvidia.so.0|g' \
              {} +
  }

  build_flatpak_payload() {
      libdir="$1"
      payload="$2"
      vulkan_cpu="$3"

      rm -rf "$payload"
      mkdir -p "$payload"

      link_payload_glob "$payload/lib" \
          "$libdir"/lib*nvidia*.so* \
          "$libdir"/libcuda.so* \
          "$libdir"/libcudadebugger.so* \
          "$libdir"/libnvcuextend.so* \
          "$libdir"/libnvcuvid.so* \
          "$libdir"/libnvoptix.so*

      for rule in \
          "$payload/lib/dri:$libdir/dri/nvidia*.so" \
          "$payload/lib/gbm:$libdir/gbm/nvidia*.so" \
          "$payload/lib/vdpau:$libdir/vdpau/libvdpau_nvidia.so*" \
          "$payload/lib/nvidia/wine:$libdir/nvidia/wine/*.dll" \
          "$payload/share/nvidia:/usr/share/nvidia/nvidia-application-profiles*" \
          "$payload/share/nvidia:/usr/share/nvidia/nvoptix.bin" \
          "$payload/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d/*nvidia*.json" \
          "$payload/egl/egl_external_platform.d:/usr/share/egl/egl_external_platform.d/*nvidia*.json" \
          "$payload/vulkan/icd.d:/usr/share/vulkan/icd.d/*nvidia*$vulkan_cpu*.json" \
          "$payload/vulkansc/icd.d:/usr/share/vulkansc/icd.d/*nvidia*$vulkan_cpu*.json" \
          "$payload/OpenCL/vendors:/etc/OpenCL/vendors/nvidia.icd"
      do
          link_payload_glob "${rule%%:*}" ${rule#*:}
      done

      # Not used for i686
      if [ -e "$libdir"/libnvidia-present.so* ]; then
          link_payload_glob "$payload/vulkan/implicit_layer.d" \
              /usr/share/vulkan/implicit_layer.d/*nvidia*.json
      fi

      rewrite_flatpak_metadata "$payload"

      # Sanity check we did not miss libraries
      find "$payload" -type f \( -name '*.json' -o -name '*.icd' \) -print0 |
          xargs -0 -r grep -hoE 'lib[^"[:space:]]+\.so([^"[:space:]]*)?' |
          sort -u |
          while read -r lib; do
              [ -e "$payload/lib/$lib" ] || {
                  printf 'Flatpak NVIDIA payload is missing metadata-referenced library: %s\n' "$lib" >&2
                  return 1
              }
          done
  }

  build_flatpak_payload /usr/lib64 /usr/lib/anatase/flatpak/nvidia "$flatpak_arch"
  if [ "$flatpak_arch" = "x86_64" ] && [ -e /usr/lib/libGLX_nvidia.so.0 ]; then
      build_flatpak_payload /usr/lib /usr/lib/anatase/flatpak/nvidia32 i686
  fi

  install -dm0755 /usr/lib/anatase/flatpak
  cat > /usr/lib/anatase/flatpak/nvidia.conf <<EOF
  org.freedesktop.Platform.GL.nvidia-$driver_version_dashed/$flatpak_arch/1.4 /usr/lib/anatase/flatpak/nvidia
  org.fedoraproject.Platform.GL.nvidia-$driver_version_dashed/$flatpak_arch/$fedora_branch /usr/lib/anatase/flatpak/nvidia
  EOF

  if [ "$flatpak_arch" = "x86_64" ]; then
      cat >> /usr/lib/anatase/flatpak/nvidia.conf <<EOF
  org.freedesktop.Platform.GL32.nvidia-$driver_version_dashed/$flatpak_arch/1.4 /usr/lib/anatase/flatpak/nvidia32
  org.fedoraproject.Platform.GL32.nvidia-$driver_version_dashed/$flatpak_arch/$fedora_branch /usr/lib/anatase/flatpak/nvidia32
  EOF
  fi
