version: 1

priority: 9

env:
  version: $nvidia

packages:
  # libva integration
  - libva-nvidia-driver

  # The rest are transient dependencies

  # Shell and service integration
  - bash
  - systemd

  # Driver runtime libraries
  - cairo
  - gdk-pixbuf2
  - glib2
  - gtk3
  - jansson
  - libtirpc
  - libvdpau
  - pango
  - libwayland-client

  # X11 runtime libraries
  - libX11
  - libXext
  - libXxf86vm

build-deps:
  - git
  - make
  - mock
  - mock-core-configs
  - rpmdevtools
  - wget

hash: >
  $version-@hash(
    nvidia.yml,
    build.sh,
    nvidia-driver,
    nvidia-kmod-common,
    nvidia-modprobe,
    nvidia-persistenced,
    nvidia-settings
  )

build: |
  set -eux
  ./build.sh
