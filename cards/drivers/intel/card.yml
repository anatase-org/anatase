version: 1

build-deps:
  - bash
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache

packages:
  x86_64:
    - intel-gmmlib
    - libva
    - libdrm
    - libpciaccess
    - libX11
    - libXext
    - libgcc
    - libstdc++

specs:
  - spec: libva-intel-media-driver/intel-media-driver-free.spec
    files:
      - intel-media-driver.metainfo.xml
    packages:
      x86_64:
        - libva-intel-media-driver
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/intel-media-driver-free
      branch: f$releasever
