version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools

packages:
  - gamescope
  - mangohud

specs:
  - spec: gamescope/gamescope.spec
    files:
      - 0001-cstdint.patch
      - Allow-to-use-system-wlroots.patch
      - Use-system-stb-glm.patch
      - gamescope.spec
      - overrides.patch
      - sources
      - stb.pc
    packages:
      - gamescope
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/gamescope
      branch: rawhide
    patch:
      type: git
      url: https://github.com/ValveSoftware/gamescope.git
      ref: ${spec:Version}
      file: overrides.patch

  - spec: mangohud/mangohud.spec
    files:
      - mangohud.spec
      - sources
    packages:
      - mangohud
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/mangohud
      branch: rawhide
