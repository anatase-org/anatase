version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

packages:
  # Base rules for hid* access
  - steam-devices
  # Implicit deps by gamescope/mangohud
  - glfw
  - libXres
  - libliftoff
  - libseat
  - luajit
  - openvr-api
  - spdlog
  - wlroots0.18
  - xcb-util-errors
  # Base gcc deps, required by steam bootstrap
  - libnsl
  - libnsl.i686
  # Mangohud lib32 deps
  - fmt.i686
  - spdlog.i686
  - libxkbcommon.i686
  # Host D-Bus service used by the Steam Flatpak for battery information.
  - upower

specs:
  - spec: gamescope/gamescope.spec
    files:
      - 0001-cstdint.patch
      - Allow-to-use-system-wlroots.patch
      - Use-system-stb-glm.patch
      - gamescope.spec
      - overrides.patch
      - sources
      - stb.pc
    packages:
      - gamescope
      - gamescope.i686
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/gamescope
      branch: f$releasever
    patch:
      type: git
      url: https://github.com/ValveSoftware/gamescope.git
      ref: ${spec:Version}
      file: overrides.patch

  - spec: mangohud/mangohud.spec
    files:
      - mangohud.spec
      - sources
    packages:
      - mangohud
      - mangohud.i686
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/mangohud
      branch: f$releasever

  - spec: xserver/xorg-x11-server-Xwayland.spec
    files:
      - xorg-x11-server-Xwayland.spec
    packages:
      - xorg-x11-server-Xwayland
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/xorg-x11-server-Xwayland
      branch: f$releasever
    patch:
      type: git
      url: https://gitlab.freedesktop.org/xorg/xserver.git
      ref: xwayland-${spec:Version}
      file: overrides.patch

  - spec: steamos-manager/steamos-manager.spec
    files:
      - steamos-manager.spec
      - overrides.patch
    packages:
      - steamos-manager
    patch:
      type: git
      url: https://github.com/evlav/steamos-manager
      ref: v${spec:Version}
      file: overrides.patch

  - spec: xdg/xdg-desktop-portal-holo.spec
    files:
      - gamescope-mimeapps.list
      - steam-http-loader
      - steam_http_loader.desktop
      - xdg-desktop-portal-holo.spec
    packages:
      - xdg-desktop-portal-holo

  - spec: xdg/xdg-desktop-portal-gamescope.spec
    files:
      - xdg-desktop-portal-gamescope.spec
      - overrides.patch
    packages:
      - xdg-desktop-portal-gamescope
    patch:
      type: git
      url: https://github.com/evlav/xdg-desktop-portal-gamescope.git
      ref: 412a4bff892bdb5726a549d03b11e6ce2f8e8152
      file: overrides.patch
      name: xdg-desktop-portal-gamescope

files:
  - files/anatase-gamemode
  - files/gamemode.desktop
  - files/gamescope-portals.conf
  - files/xdg-desktop-portal-gamescope.conf

postprocess: |
  set -eux

  install -Dm0755 /files/files/anatase-gamemode \
      /usr/bin/anatase-gamemode
  install -Dm0644 /files/files/gamemode.desktop \
      /usr/share/wayland-sessions/gamemode.desktop
  install -Dm0644 /files/files/gamescope-portals.conf \
      /usr/share/xdg-desktop-portal/gamescope-portals/gamescope-portals.conf
  install -Dm0644 /files/files/xdg-desktop-portal-gamescope.conf \
      /usr/lib/systemd/user/xdg-desktop-portal.service.d/gamescope.conf

  # Flatpak's portal broker still uses UseIn to select backend descriptors.
  sed -i '/^DBusName=/a UseIn=gamescope;' \
      /usr/share/xdg-desktop-portal/gamescope-portals/gamescope.portal \
      /usr/share/xdg-desktop-portal/gamescope-portals/holo.portal
  sed -i \
      -e '/^After=graphical-session.target$/d' \
      -e '/^PartOf=graphical-session.target$/d' \
      /usr/lib/systemd/user/xdg-desktop-portal-holo.service

  bash -n /usr/bin/anatase-gamemode
  grep -Fx 'Exec=/usr/libexec/plasma-dbus-run-session-if-needed /usr/bin/anatase-gamemode' \
      /usr/share/wayland-sessions/gamemode.desktop
  grep -Fx 'DesktopNames=gamescope' \
      /usr/share/wayland-sessions/gamemode.desktop
  grep -Fx 'Requisite=' \
      /usr/lib/systemd/user/xdg-desktop-portal.service.d/gamescope.conf
  grep -Fx 'UseIn=gamescope;' \
      /usr/share/xdg-desktop-portal/gamescope-portals/gamescope.portal \
      /usr/share/xdg-desktop-portal/gamescope-portals/holo.portal
  ! grep -Eq '^(After|PartOf)=graphical-session.target$' \
      /usr/lib/systemd/user/xdg-desktop-portal-holo.service

  # 
  # Dummy polkit helpers for steam. It expects them in hardcoded paths,
  # so we need to provide them in the image which is unfortunate.
  #

  install -dm0755 /usr/bin/steamos-polkit-helpers

  cat > /usr/bin/steamos-polkit-helpers/dummy <<'EOF'
  #!/bin/sh
  case "${0##*/}" in
      steamos-update)
          for arg do
              if [ "$arg" = --supports-duplicate-detection ]; then
                  exit 0
              fi
          done
          # SteamOS uses 7 to mean that there is no system update to perform.
          exit 7
          ;;
      jupiter-check-support)
          echo 'Supported: yes'
          exit 0
          ;;
      jupiter-dock-updater)
          # Its --check convention uses zero to mean an update is available.
          exit 1
          ;;
      steamos-factory-reset-config|steamos-format-device|steamos-format-sdcard|\
      steamos-priv-write|steamos-reboot-other)
          # Do not claim that an unsupported destructive operation succeeded.
          exit 1
          ;;
      *)
          exit 0
          ;;
  esac
  EOF
  chmod 0755 /usr/bin/steamos-polkit-helpers/dummy

  # Steam hardcodes these paths. Anatase implements none of these SteamOS
  # privileged helpers, so expose the dispatcher above for every known call.
  for helper in \
      jupiter-biosupdate \
      jupiter-check-support \
      jupiter-dock-updater \
      jupiter-fan-control \
      jupiter-get-als-gain \
      steamos-factory-reset-config \
      steamos-format-device \
      steamos-format-sdcard \
      steamos-priv-write \
      steamos-reboot-other \
      steamos-set-hostname \
      steamos-set-timezone \
      steamos-trim-devices \
      steamos-update; do
      ln -s dummy "/usr/bin/steamos-polkit-helpers/$helper"
  done
