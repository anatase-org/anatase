version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

packages:
  # Base rules for hid* access
  - steam-devices
  # Implicit deps by gamescope/mangohud
  - glfw
  - libXres
  - libliftoff
  - libseat
  - luajit
  - openvr-api
  - spdlog
  - wlroots0.18
  - xcb-util-errors
  # Base gcc deps, required by steam bootstrap
  - libnsl
  - libnsl.i686
  # Mangohud lib32 deps
  - fmt.i686
  - spdlog.i686
  - libxkbcommon.i686

specs:
  - spec: gamescope/gamescope.spec
    files:
      - 0001-cstdint.patch
      - Allow-to-use-system-wlroots.patch
      - Use-system-stb-glm.patch
      - gamescope.spec
      - overrides.patch
      - sources
      - stb.pc
    packages:
      - gamescope
      - gamescope.i686
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/gamescope
      branch: f$releasever
    patch:
      type: git
      url: https://github.com/ValveSoftware/gamescope.git
      ref: ${spec:Version}
      file: overrides.patch

  - spec: mangohud/mangohud.spec
    files:
      - mangohud.spec
      - sources
    packages:
      - mangohud
      - mangohud.i686
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/mangohud
      branch: f$releasever

  - spec: xserver/xorg-x11-server-Xwayland.spec
    files:
      - xorg-x11-server-Xwayland.spec
    packages:
      - xorg-x11-server-Xwayland
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/xorg-x11-server-Xwayland
      branch: f$releasever
    patch:
      type: git
      url: https://gitlab.freedesktop.org/xorg/xserver.git
      ref: xwayland-${spec:Version}
      file: overrides.patch

  - spec: steamos-manager/steamos-manager.spec
    files:
      - steamos-manager.spec
      - overrides.patch
    packages:
      - steamos-manager
    patch:
      type: git
      url: https://github.com/evlav/steamos-manager
      ref: v${spec:Version}
      file: overrides.patch

  - spec: xdg/xdg-desktop-portal-holo.spec
    files:
      - gamescope-mimeapps.list
      - steam-http-loader
      - steam_http_loader.desktop
      - xdg-desktop-portal-holo.spec
    packages:
      - xdg-desktop-portal-holo

  - spec: xdg/xdg-desktop-portal-gamescope.spec
    files:
      - xdg-desktop-portal-gamescope.spec
      - overrides.patch
    packages:
      - xdg-desktop-portal-gamescope
    patch:
      type: git
      url: https://github.com/evlav/xdg-desktop-portal-gamescope.git
      ref: 412a4bff892bdb5726a549d03b11e6ce2f8e8152
      file: overrides.patch
      name: xdg-desktop-portal-gamescope

files:
  - files/anatase-gamemode
  - files/gamemode.desktop
  - files/gamescope-portals.conf

postprocess: |
  set -eux

  install -Dm0755 /files/files/anatase-gamemode \
      /usr/bin/anatase-gamemode
  install -Dm0644 /files/files/gamemode.desktop \
      /usr/share/wayland-sessions/gamemode.desktop
  install -Dm0644 /files/files/gamescope-portals.conf \
      /usr/share/xdg-desktop-portal/gamescope-portals/gamescope-portals.conf

  bash -n /usr/bin/anatase-gamemode
  grep -Fx 'Exec=/usr/libexec/plasma-dbus-run-session-if-needed /usr/bin/anatase-gamemode' \
      /usr/share/wayland-sessions/gamemode.desktop
  grep -Fx 'DesktopNames=gamescope' \
      /usr/share/wayland-sessions/gamemode.desktop
