version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools

packages:
  - fuse
  - hidapi
  - python3-evdev
  - python3-markdown-it-py
  - python3-mdurl
  - python3-pygments
  - python3-pyroute2
  - python3-pyserial
  - python3-rich
  - python3-setuptools
  - python3-six
  - python3-xlib
  - fpaste

files:
  - files/hhd.conf
  - files/hhd-modprobe.conf
  - gamecontrollerdb.txt::https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/refs/heads/master/gamecontrollerdb.txt

specs:
  - spec: hhd-power-profiles/hhd-power-profiles.spec
    packages:
      - hhd-power-profiles

  # - spec: git+https://github.com/hhd-dev/hhd:hhd.spec
  #   files:
  #     - hhd.spec
  #   packages:
  #     - hhd
  # - spec: git+https://github.com/hhd-dev/hhd-ui-copr:hhd-ui.spec
  #   packages:
  #     - hhd-ui

  # Use git for now
  - spec: git+https://github.com/hhd-dev/hhd:hhd-git.spec
    packages:
      - hhd
  - spec: git+https://github.com/hhd-dev/hhd-ui:pkg/hhd-ui-git.spec
    packages:
      - hhd-ui

postprocess: |
  set -eux

  # Report a critical battery level at 3% instead of 5%.
  if [ -f /etc/UPower/UPower.conf ]; then
      sed -i 's/^PercentageCritical=.*/PercentageCritical=3.0/' \
          /etc/UPower/UPower.conf
  fi

  install -dm0755 /usr/lib/systemd/system-preset
  cat > /usr/lib/systemd/system-preset/80-anatase-hhd.preset <<'EOF'
  enable hhd.service
  EOF
  systemctl preset hhd.service || true

  # Add our overrides
  install -dm0755 /usr/lib/systemd/system/hhd.service.d/
  cp /files/files/hhd.conf /usr/lib/systemd/system/hhd.service.d/override.conf

  # Base has no Plasma Login Manager to handle HHD's autologin requests.
  if ! rpm -q plasma-login-manager >/dev/null 2>&1; then
      sed -i '/^Environment="HHD_GS_AUTOLOGIN=/d' \
          /usr/lib/systemd/system/hhd.service.d/override.conf
  fi

  # Add modprobe.d for weird modules
  cp /files/files/hhd-modprobe.conf \
    /etc/modprobe.d/70-hhd.conf

  # Add controller DB for hhd's external controller support
  install -Dm0644 /files/gamecontrollerdb.txt /usr/share/sdl/gamecontrollerdb.txt
