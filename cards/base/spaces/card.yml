version: 1

build-deps:
  - binutils
  - container-selinux
  - gcc
  - glib2-devel
  - pam-devel
  - pytest
  - python3-aiohttp
  - python3-build
  - python3-devel
  - python3-installer
  - python3-jinja2
  - python3-linkify-it-py
  - python3-markdown-it-py
  - python3-mdit-py-plugins
  - python3-pip
  - python3-platformdirs
  - python3-poetry-core
  - python3-pytest-aiohttp
  - python3-pytest-asyncio
  - python3-rich
  - python3-setuptools
  - python3-syrupy
  - python3-time-machine
  - python3-typing-extensions
  - python3-wheel
  - rpm-build
  - rpmdevtools
  - selinux-policy-devel
  - systemd-rpm-macros

packages:
  - arch-install-scripts
  - container-selinux
  - debootstrap
  - dnf5
  - glib2
  - librsvg2-tools
  - pam
  - polkit
  - python3
  - python3-linkify-it-py
  - python3-markdown-it-py
  - python3-mdit-py-plugins
  - python3-pillow
  - python3-platformdirs
  - python3-rich
  - python3-typing-extensions
  - systemd
  - systemd-container
  - xdg-dbus-proxy

files:
  - config.json
  - zshrc.arch
  - zshrc.kali
  - zshrc.ubuntu

specs:
  - spec: python-textual/python-textual.spec
    files:
      - python-textual.spec
    packages:
      - python3-textual
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/python-textual
      branch: rawhide
  - spec: git+https://github.com/anatase-org/spaces:spaces-git.spec
    packages:
      - spaces
      - spaces-selinux

postprocess: |
  set -eux

  install -Dm0644 /files/config.json /etc/spaces/config.json
  install -Dm0644 /files/zshrc.arch \
      /usr/share/anatase/zsh/zshrc/arch
  install -Dm0644 /files/zshrc.kali \
      /usr/share/anatase/zsh/zshrc/kali
  install -Dm0644 /files/zshrc.ubuntu \
      /usr/share/anatase/zsh/zshrc/ubuntu
