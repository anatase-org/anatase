postprocess: |
  set -eux

  install -dm0755 /usr/lib/systemd/journald.conf.d
  cat > /usr/lib/systemd/journald.conf.d/10-persistent.conf <<'EOF'
  [Journal]
  Storage=persistent
  EOF

  if command -v systemctl >/dev/null; then
      systemctl set-default graphical.target
  fi

  if [ -e /usr/libexec/samba/cups_backend_smb ]; then
      install -dm0755 /usr/lib/cups/backend
      ln -snf /usr/libexec/samba/cups_backend_smb /usr/lib/cups/backend/smb
  fi

  install -dm0755 /usr/lib/systemd/system /usr/lib/systemd/system-preset

  cat > /usr/lib/systemd/system/fedora-atomic-desktop-appstream-cache-refresh.service <<'EOF'
  [Unit]
  Description=Refresh appstream cache on Atomic Desktops
  Documentation=https://gitlab.com/fedora/ostree/sig/-/work_items/103
  ConditionPathIsReadWrite=/var
  ConditionPathExists=/run/ostree-booted
  After=local-fs.target

  [Service]
  Type=oneshot
  RemainAfterExit=yes
  ExecStart=appstreamcli refresh --force
  Nice=19
  IOWeight=10

  [Install]
  WantedBy=multi-user.target
  EOF

  cat > /usr/lib/systemd/system/fedora-atomic-desktop-mandb-update.service <<'EOF'
  [Unit]
  Description=Update mandb cache on Atomic Desktops
  Documentation=https://gitlab.com/fedora/ostree/sig/-/work_items/62
  ConditionPathIsReadWrite=/var
  ConditionPathExists=/run/ostree-booted
  After=local-fs.target

  [Service]
  Type=oneshot
  RemainAfterExit=yes
  Environment=MAN_NO_LOCALE_WARNING=1
  ExecStart=mandb -q
  Nice=19
  IOWeight=10

  [Install]
  WantedBy=multi-user.target
  EOF

  cat >> /usr/lib/systemd/system-preset/81-atomic-desktop.preset <<'EOF'

  # See: https://gitlab.com/fedora/ostree/sig/-/work_items/103
  enable fedora-atomic-desktop-appstream-cache-refresh.service

  # See: https://gitlab.com/fedora/ostree/sig/-/work_items/62
  enable fedora-atomic-desktop-mandb-update.service
  EOF

  systemctl preset fedora-atomic-desktop-appstream-cache-refresh.service || true
  systemctl preset fedora-atomic-desktop-mandb-update.service || true
