# SPDX-License-Identifier: BSD-3-Clause
# Samsung Galaxy Book4 Edge 14 (NP940XMA)
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/GalaxyBook4Edge14-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
	cset "name='SpkrLeft PA Volume' 1"
	cset "name='SpkrRight PA Volume' 1"
	cset "name='WSA WSA_RX0 Digital Volume' 81"
	cset "name='WSA WSA_RX1 Digital Volume' 81"
	cset "name='WSA2 WSA_RX0 Digital Volume' 81"
	cset "name='WSA2 WSA_RX1 Digital Volume' 81"
	cset "name='WSA WSA_COMP1 Switch' 0"
	cset "name='WSA WSA_COMP2 Switch' 0"
	cset "name='WSA2 WSA_COMP1 Switch' 0"
	cset "name='WSA2 WSA_COMP2 Switch' 0"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"

# The amplifier PA controls have a fixed gain within the kernel's safe range.
# Use the two active digital paths for the stereo speaker volume instead.
LibraryConfig.remap.Config {
	ctl.default.map {
		"name='Speakers Volume'" {
			"name='WSA WSA_RX0 Digital Volume'".vindex.0 0
			"name='WSA2 WSA_RX0 Digital Volume'".vindex.1 0
		}
	}
}
