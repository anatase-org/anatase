version: 1

env:
  distro: $distro

packages:
    # Atomic boot
    - bootupd

    # Package management
    - dnf5-plugins
    - fedora-repos-archive

    # Image layering
    - rpm-ostree

    # Basic disk helpers
    - dosfstools
    - libblockdev-btrfs
    - libblockdev-dm
    - libblockdev-lvm
    - libblockdev-mpath

    # Installer
    - anaconda-webui
    - anaconda-live
    - slitherer
    - dracut-live
    - xorriso
    - dosfstools
    - mtools
    - erofs-utils

    # Flatpak runtime libraries
    - libcxx # chromium qt theme
    - libcxxabi # chromium qt theme

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

specs:
  - spec: bootc/bootc.spec
    files:
      - sources
      - overrides.patch
    packages:
      - bootc
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/bootc
      branch: f$releasever
    patch:
      type: git
      url: https://github.com/bootc-dev/bootc
      ref: v${spec:Version}
      file: overrides.patch

files:
  - keys/anatase-mok-ca.crt
  - keys/anatase-gpg.pub.asc
  - keys/anatase-cosign-root.pem
  - containers/anatase-registries.yaml
  - containers/anatase-container-policy
  - containers/anatase-container-policy.service
  - flatpak/anatase-runtime-deploy
  - flatpak/anatase-flatpak-extensions
  - flatpak/anatase-flatpak-extensions.service
  - flatpak/anatase-flatpaks.service
  - flatpak/anatase.flatpakrepo
  - flatpak/flathub.filter
  - flatpak/flathub.flatpakrepo
  - dracut_cleanup_shadow.sh

postprocess: |
    set -eux

    install -dm0755 /usr/lib/ostree
    cat > /usr/lib/ostree/prepare-root.conf <<'EOF'
    [sysroot]
    readonly = true

    [composefs]
    enabled = yes
    EOF

    install -dm0755 /usr/lib/dracut/dracut.conf.d
    cat > /usr/lib/dracut/dracut.conf.d/20-atomic-bootc.conf <<'EOF'
    # Include the bootc/ostree root setup path in the generated initramfs.
    add_dracutmodules+=" ostree bootc "
    EOF

    cat > /usr/lib/dracut/dracut.conf.d/20-installer.conf <<'EOF'
    # Add installer dracut modules so we do not need to regenerate initramfs
    add_dracutmodules+=" dmsquash-live "
    EOF

    # Drop days from /etc/shadow so that initramfs is reproducible
    install -Dm0755 /files/dracut_cleanup_shadow.sh \
        /usr/lib/dracut/modules.d/99anatase-shadow/module-setup.sh

    for glibc_post_upgrade in /usr/sbin/glibc_post_upgrade.*; do
        if [ -f "${glibc_post_upgrade}" ]; then
            ln -srf /usr/bin/true "${glibc_post_upgrade}"
        fi
    done

    rm -rf /usr/lib/ostree-boot/loader

    rm -rf /etc/systemd/system/*
    systemctl preset-all || true
    rm -rf /etc/systemd/user/*
    systemctl --user --global preset-all || true

    install -dm0755 /usr/lib/systemd/system-preset /usr/lib/tmpfiles.d

    # Remove the rules trying to create the symlinked dirs and emitting errors
    rm -f /usr/lib/tmpfiles.d/home.conf
    if [ -f /usr/lib/tmpfiles.d/provision.conf ]; then
        sed -i 's|^d- /root :0700 root :root -$|# d- /root :0700 root :root -|' /usr/lib/tmpfiles.d/provision.conf
    fi

    #
    # Flatpak Remotes
    #

    install -Dm0644 /files/flatpak/flathub.filter \
        /usr/share/flatpak/filters/flathub.filter
    install -Dm0644 /files/flatpak/flathub.flatpakrepo \
        /usr/share/flatpak/remotes.d/flathub.flatpakrepo
    install -Dm0644 /files/flatpak/anatase.flatpakrepo \
        /usr/share/flatpak/remotes.d/anatase.flatpakrepo
    install -Dm0644 /files/keys/anatase-gpg.pub.asc \
        /usr/share/anatase/keys/anatase-gpg.pub.asc
    install -Dm0644 /files/keys/anatase-cosign-root.pem \
        /usr/share/anatase/keys/anatase-cosign-root.pem
    install -Dm0644 /files/containers/anatase-registries.yaml \
        /etc/containers/registries.d/anatase.yaml
    install -Dm0755 /files/containers/anatase-container-policy \
        /usr/libexec/anatase-container-policy
    install -Dm0644 /files/containers/anatase-container-policy.service \
        /usr/lib/systemd/system/anatase-container-policy.service
    cat > /usr/lib/systemd/system-preset/80-anatase-container-policy.preset <<'EOF'
    enable anatase-container-policy.service
    EOF
    /usr/libexec/anatase-container-policy
    systemctl preset anatase-container-policy.service || true
    gpg_key="$(awk '
        /^-----BEGIN PGP PUBLIC KEY BLOCK-----$/ { body = 1; next }
        /^-----END PGP PUBLIC KEY BLOCK-----$/ { body = 0; next }
        body && $0 !~ /:/ && $0 !~ /^=/ && length($0) { printf "%s", $0 }
    ' /files/keys/anatase-gpg.pub.asc)"
    sed -i "s|@gpg@|${gpg_key}|g" \
        /usr/share/flatpak/remotes.d/anatase.flatpakrepo
    sed -i "s|%distro%|${distro}|g" \
        /usr/share/flatpak/remotes.d/anatase.flatpakrepo
    install -Dm0644 /files/flatpak/anatase-flatpaks.service \
        /usr/lib/systemd/system/anatase-flatpaks.service
    sed -i "s|%distro%|${distro}|g" \
        /usr/lib/systemd/system/anatase-flatpaks.service
    cat > /usr/lib/systemd/system-preset/80-anatase-flatpaks.preset <<'EOF'
    enable anatase-flatpaks.service
    EOF
    systemctl preset anatase-flatpaks.service || true

    #
    # Flatpak Extension Management
    #

    install -dm0755 /usr/lib/anatase/flatpak
    flatpak_arch="$(rpm -E '%_arch')"
    runtime_branch="stable"
    runtime_id="org.anatase.Platform"
    runtime_dir="/usr/lib/anatase/flatpak/runtime/${runtime_id}/${flatpak_arch}/${runtime_branch}"
    runtime_override_dir="${runtime_dir}/overrides"

    install -dm0755 "${runtime_dir}/files" "${runtime_override_dir}/etc"
    cat > "${runtime_override_dir}/etc/ld.so.conf" <<'EOF'
    include /run/flatpak/ld.so.conf.d/app-*.conf
    include /app/etc/ld.so.conf
    include /app/etc/ld.so.conf.d/*.conf
    /app/lib64
    /app/lib
    include /run/flatpak/ld.so.conf.d/runtime-*.conf
    EOF
    cat > "${runtime_dir}/metadata" <<EOF
    [Runtime]
    name=${runtime_id}

    [Environment]
    QT_PLUGIN_PATH=/app/lib64/qt6/plugins:/usr/lib64/qt6/plugins
    QML2_IMPORT_PATH=/app/lib64/qt6/qml:/usr/lib64/qt6/qml
    QT_QPA_PLATFORMTHEME=kde
    EOF
    # DO NOT TOUCH THIS CASUALLY.
    # anatase-runtime-deploy embeds the Flatpak-imported OSTree commit and OCI
    # manifest digest for the deterministic dummy runtime in the Anatase OCI
    # Flatpak remote. If these values do not exactly match the remote, Discover
    # will report org.anatase.Platform as updateable forever. Only change them
    # when regenerating and uploading the dummy runtime and updating
    # flatpak/anatase-flatpak-extensions in the same commit.
    # python3 - <<'PY'
    # from gi.repository import GLib
    # commit = "45a3b20413966e9c9070ac7459c797175ae7a70dd424e1534c5e3128844a4bc8"
    # oci_digest = "45a3b20413966e9c9070ac7459c797175ae7a70dd424e1534c5e3128844a4bc8"
    # metadata = {
    #     "deploy-version": GLib.Variant("i", 4),
    #     "timestamp": GLib.Variant("t", 0),
    #     "alt-id": GLib.Variant("s", oci_digest),
    # }
    # deploy = GLib.Variant("(ssasta{sv})", ("anatase", commit, [], 0, metadata))
    # open("flatpak/anatase-runtime-deploy", "wb").write(deploy.get_data_as_bytes().get_data())
    # PY
    install -Dm0644 /files/flatpak/anatase-runtime-deploy "${runtime_dir}/deploy"

    cat > /usr/lib/anatase/flatpak/runtime.conf <<EOF
    runtime/${runtime_id}/${flatpak_arch}/${runtime_branch} ${runtime_dir}
    EOF

    install -Dm0755 /files/flatpak/anatase-flatpak-extensions \
        /usr/libexec/anatase-flatpak-extensions
    install -Dm0644 /files/flatpak/anatase-flatpak-extensions.service \
        /usr/lib/systemd/system/anatase-flatpak-extensions.service
    cat > /usr/lib/systemd/system-preset/80-anatase-flatpak-extensions.preset <<'EOF'
    enable anatase-flatpak-extensions.service
    EOF
    systemctl preset anatase-flatpak-extensions.service || true

    #
    # Atomic Desktop Maintenance
    #

    cat > /usr/lib/systemd/system/fedora-atomic-desktop-appstream-cache-refresh.service <<'EOF'
    [Unit]
    Description=Refresh appstream cache on Atomic Desktops
    Documentation=https://gitlab.com/fedora/ostree/sig/-/work_items/103
    ConditionPathIsReadWrite=/var
    ConditionPathExists=/run/ostree-booted
    After=local-fs.target

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/usr/bin/flatpak --system update --appstream
    ExecStart=/usr/bin/appstreamcli refresh --force
    Nice=19
    IOWeight=10

    [Install]
    WantedBy=multi-user.target
    EOF

    cat > /usr/lib/systemd/system/fedora-atomic-desktop-mandb-update.service <<'EOF'
    [Unit]
    Description=Update mandb cache on Atomic Desktops
    Documentation=https://gitlab.com/fedora/ostree/sig/-/work_items/62
    ConditionPathIsReadWrite=/var
    ConditionPathExists=/run/ostree-booted
    After=local-fs.target

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    Environment=MAN_NO_LOCALE_WARNING=1
    ExecStart=/usr/bin/mandb -q
    Nice=19
    IOWeight=10

    [Install]
    WantedBy=multi-user.target
    EOF

    cat >> /usr/lib/systemd/system-preset/81-atomic-desktop.preset <<'EOF'

    # DNF metadata is not used to update bootc systems. Enabling this timer
    # also pulls network-online.target into every boot through Wants=.
    disable dnf-makecache.timer

    # See: https://gitlab.com/fedora/ostree/sig/-/work_items/103
    enable fedora-atomic-desktop-appstream-cache-refresh.service

    # See: https://gitlab.com/fedora/ostree/sig/-/work_items/62
    enable fedora-atomic-desktop-mandb-update.service
    EOF

    systemctl preset dnf-makecache.timer || true
    systemctl preset fedora-atomic-desktop-appstream-cache-refresh.service || true
    systemctl preset fedora-atomic-desktop-mandb-update.service || true

    #
    # Installer fixups
    #

    # Mute socket motd
    rm -rf /etc/motd.d/cockpit

    #
    # Prepare boot
    #

    # This is slightly risky if postprocess steps after this card modify
    # dracut, but lets the postprocess steps in later cards run faster

    # Generate proper initramfs under /usr/lib/modules/${kver}/
    rm -rf /boot/initramfs-*.img
    for kernel in /usr/lib/modules/*/vmlinuz; do
        [ -e "${kernel}" ] || continue
        kver=${kernel%/vmlinuz}
        kver=${kver##*/}
        /usr/bin/dracut --no-hostonly --kver "${kver}" \
            --reproducible --zstd -v --force \
            "/usr/lib/modules/${kver}/initramfs.img"
        chmod 0600 "/usr/lib/modules/${kver}/initramfs.img"
    done

    # Move boot into /usr/lib/ostree-boot
    rm -rf /usr/lib/ostree-boot
    mv /boot /usr/lib/ostree-boot

    # Add our key to the image
    mkdir -p /usr/lib/ludos/efi
    openssl x509 \
        -in /files/keys/anatase-mok-ca.crt \
        -outform DER \
        -out /usr/lib/ludos/efi/ANATASE-KEY-ENROLLME.der

    # bootupd installs EFI payloads from /usr/lib/efi. Keep the source tree
    # aligned with the Anatase bootloader path instead of inheriting Fedora's
    # vendor directory.
    for efi_dir in /usr/lib/efi/*/*/EFI; do
        [ -d "${efi_dir}" ] || continue
        if [ -d "${efi_dir}/fedora" ]; then
            rm -rf "${efi_dir}/anatase"
            mv "${efi_dir}/fedora" "${efi_dir}/anatase"
        fi
    done

    # Allow forcing bootupd to update efi by bumping dist
    dist=1
    install -d "/usr/lib/efi/anatase/${dist}/EFI"

    if command -v bootupctl >/dev/null; then
        bootupctl backend generate-update-metadata || true
    fi

    # Enable bootupd
    install -dm0755 /usr/lib/systemd/system/bootloader-update.service.d
    cat > /usr/lib/systemd/system/bootloader-update.service.d/migrate-static-grub-config.conf <<'EOF'
    [Service]
    ExecStart=/usr/bin/bootupctl migrate-static-grub-config
    EOF
    cat > /usr/lib/systemd/system-preset/80-anatase-bootupd.preset <<'EOF'
    enable bootloader-update.service
    EOF
    systemctl preset bootloader-update.service || true

    # Fix stale / entries in /etc/fstab before systemd-remount-fs applies root
    # mount options on bootc systems.
    # https://github.com/fedora-iot/iot-distro/issues/81
    cat > /usr/lib/systemd/system/anatase-fixup-etc-fstab.service <<'EOF'
    [Unit]
    Description=Fix stale root mount in /etc/fstab
    DefaultDependencies=no
    After=systemd-fsck-root.service
    Before=local-fs-pre.target local-fs.target shutdown.target systemd-remount-fs.service

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=bootc internals fixup-etc-fstab

    [Install]
    WantedBy=local-fs.target
    EOF
    cat > /usr/lib/systemd/system-preset/80-anatase-fstab.preset <<'EOF'
    enable anatase-fixup-etc-fstab.service
    EOF
    systemctl preset anatase-fixup-etc-fstab.service || true
