version: 1

packages:
    # Atomic boot
    - bootupd

    # Package management
    - dnf5-plugins
    - fedora-repos-archive

    # Image layering
    - rpm-ostree

    # Basic disk helpers
    - dosfstools
    - libblockdev-btrfs
    - libblockdev-dm
    - libblockdev-lvm
    - libblockdev-mpath

    # Installer
    - anaconda-webui
    - anaconda-live
    - slitherer
    - dracut-live
    - xorriso
    - dosfstools
    - mtools
    - erofs-utils

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

specs:
  - spec: bootc/bootc.spec
    files:
      - sources
      - overrides.patch
    packages:
      - bootc
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/bootc
      branch: f$releasever
    patch:
      type: git
      url: https://github.com/bootc-dev/bootc
      ref: v${spec:Version}
      file: overrides.patch

files:
  - ./anatase-mok-ca.cer
  - flatpak/anatase-runtime-deploy
  - flatpak/anatase-flatpak-extensions
  - flatpak/anatase-flatpak-extensions.service

postprocess: |
    set -eux

    install -dm0755 /usr/lib/ostree
    cat > /usr/lib/ostree/prepare-root.conf <<'EOF'
    [sysroot]
    readonly = true

    [composefs]
    enabled = yes
    EOF

    install -dm0755 /usr/lib/dracut/dracut.conf.d
    cat > /usr/lib/dracut/dracut.conf.d/20-atomic-bootc.conf <<'EOF'
    # Include the bootc/ostree root setup path in the generated initramfs.
    add_dracutmodules+=" ostree bootc "
    EOF

    cat > /usr/lib/dracut/dracut.conf.d/20-installer.conf <<'EOF'
    # Add installer dracut modules so we do not need to regenerate initramfs
    add_dracutmodules+=" dmsquash-live "
    EOF

    for glibc_post_upgrade in /usr/sbin/glibc_post_upgrade.*; do
        if [ -f "${glibc_post_upgrade}" ]; then
            ln -srf /usr/bin/true "${glibc_post_upgrade}"
        fi
    done

    rm -rf /usr/lib/ostree-boot/loader

    rm -rf /etc/systemd/system/*
    systemctl preset-all || true
    rm -rf /etc/systemd/user/*
    systemctl --user --global preset-all || true

    install -dm0755 /usr/lib/systemd/system-preset /usr/lib/tmpfiles.d

    # Remove the rules trying to create the symlinked dirs and emitting errors
    rm -f /usr/lib/tmpfiles.d/home.conf
    if [ -f /usr/lib/tmpfiles.d/provision.conf ]; then
        sed -i 's|^d- /root :0700 root :root -$|# d- /root :0700 root :root -|' /usr/lib/tmpfiles.d/provision.conf
    fi

    #
    # Flatpak Extension Management
    #

    install -dm0755 /usr/lib/anatase/flatpak
    flatpak_arch="$(rpm -E '%_arch')"
    runtime_branch="f$(rpm -E '%fedora')"
    runtime_id="org.anatase.Platform"
    runtime_dir="/usr/lib/anatase/flatpak/runtime/${runtime_id}/${flatpak_arch}/${runtime_branch}"
    runtime_override_dir="${runtime_dir}/overrides"

    install -dm0755 "${runtime_dir}/files" "${runtime_override_dir}/etc"
    cat > "${runtime_override_dir}/etc/ld.so.conf" <<'EOF'
    include /run/flatpak/ld.so.conf.d/app-*.conf
    include /app/etc/ld.so.conf
    include /app/etc/ld.so.conf.d/*.conf
    /app/lib64
    /app/lib
    include /run/flatpak/ld.so.conf.d/runtime-*.conf
    EOF
    cat > "${runtime_dir}/metadata" <<EOF
    [Runtime]
    name=${runtime_id}

    [Environment]
    QT_PLUGIN_PATH=/app/lib64/qt6/plugins:/usr/share/runtime/lib/plugins
    QML2_IMPORT_PATH=/app/lib64/qt6/qml
    EOF
    # anatase-runtime-deploy is a static Flatpak deploy-data v4 GLib Variant:
    # python3 - <<'PY'
    # from gi.repository import GLib
    # metadata = {"deploy-version": GLib.Variant("i", 4), "timestamp": GLib.Variant("t", 0)}
    # deploy = GLib.Variant("(ssasta{sv})", ("anatase", "0" * 64, [], 0, metadata))
    # open("flatpak/anatase-runtime-deploy", "wb").write(deploy.get_data_as_bytes().get_data())
    # PY
    install -Dm0644 /files/flatpak/anatase-runtime-deploy "${runtime_dir}/deploy"

    cat > /usr/lib/anatase/flatpak/runtime.conf <<EOF
    runtime/${runtime_id}/${flatpak_arch}/${runtime_branch} ${runtime_dir}
    EOF

    install -Dm0755 /files/flatpak/anatase-flatpak-extensions \
        /usr/libexec/anatase-flatpak-extensions
    install -Dm0644 /files/flatpak/anatase-flatpak-extensions.service \
        /usr/lib/systemd/system/anatase-flatpak-extensions.service
    cat > /usr/lib/systemd/system-preset/80-anatase-flatpak-extensions.preset <<'EOF'
    enable anatase-flatpak-extensions.service
    EOF
    systemctl preset anatase-flatpak-extensions.service || true

    #
    # Installer fixups
    #

    # Mute socket motd
    rm -rf /etc/motd.d/cockpit

    #
    # Prepare boot
    #

    # This is slightly risky if postprocess steps after this card modify
    # dracut, but lets the postprocess steps in later cards run faster

    # Generate proper initramfs under /usr/lib/modules/${kver}/
    rm -rf /boot/initramfs-*.img
    for kernel in /usr/lib/modules/*/vmlinuz; do
        [ -e "${kernel}" ] || continue
        kver=${kernel%/vmlinuz}
        kver=${kver##*/}
        /usr/bin/dracut --no-hostonly --kver "${kver}" \
            --reproducible --zstd -v --force \
            "/usr/lib/modules/${kver}/initramfs.img"
        chmod 0600 "/usr/lib/modules/${kver}/initramfs.img"
    done

    # Move boot into /usr/lib/ostree-boot
    rm -rf /usr/lib/ostree-boot
    mv /boot /usr/lib/ostree-boot

    # Add our key to the image
    mkdir -p /usr/lib/ludos/efi
    openssl x509 \
        -in /files/anatase-mok-ca.cer \
        -outform DER \
        -out /usr/lib/ludos/efi/ANATASE-KEY-ENROLLME.der

    # bootupd installs EFI payloads from /usr/lib/efi. Keep the source tree
    # aligned with the Anatase bootloader path instead of inheriting Fedora's
    # vendor directory.
    for efi_dir in /usr/lib/efi/*/*/EFI; do
        [ -d "${efi_dir}" ] || continue
        if [ -d "${efi_dir}/fedora" ]; then
            rm -rf "${efi_dir}/anatase"
            mv "${efi_dir}/fedora" "${efi_dir}/anatase"
        fi
    done

    # Allow forcing bootupd to update efi by bumping dist
    dist=1
    install -d "/usr/lib/efi/anatase/${dist}/EFI"

    if command -v bootupctl >/dev/null; then
        bootupctl backend generate-update-metadata || true
    fi

    # Enable bootupd
    install -dm0755 /usr/lib/systemd/system/bootloader-update.service.d
    cat > /usr/lib/systemd/system/bootloader-update.service.d/migrate-static-grub-config.conf <<'EOF'
    [Service]
    ExecStart=/usr/bin/bootupctl migrate-static-grub-config
    EOF
    cat > /usr/lib/systemd/system-preset/80-anatase-bootupd.preset <<'EOF'
    enable bootloader-update.service
    EOF
    systemctl preset bootloader-update.service || true
