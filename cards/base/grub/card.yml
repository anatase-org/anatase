version: 1

packages:
    - mtools

oci:
    - efibootmgr
    # Fedora shims
    - shim-ia32
    - shim-x64
    # Our grub + fwupd efi
    - oci: sb-efi
      packages:
        - fwupd-efi
        - grub2-efi-ia32
        - grub2-efi-x64
        - grub2-common
        - grub2-tools
        - grub2-tools-minimal
        - grub2-tools-extra
        - grub2-pc
        - grub2-pc-modules
files:
    - grub_boot_minimal.cfg
    - grub_boot_otheros.cfg
    - grub-boot-remount
    - grub-boot-success
    - grub-boot-success.service
    - grub-boot-success.timer

postprocess: |
    set -eux

    install -Dm0755 /files/grub-boot-remount \
        /usr/libexec/grub-boot-remount
    install -Dm0755 /files/grub-boot-success \
        /usr/libexec/grub-boot-success
    install -Dm0644 /files/grub-boot-success.service \
        /usr/lib/systemd/system/grub-boot-success.service
    install -Dm0644 /files/grub-boot-success.timer \
        /usr/lib/systemd/system/grub-boot-success.timer
    install -Dm0644 /files/grub_boot_minimal.cfg \
        /usr/lib/bootupd/grub2-static/configs.d/08_grub_boot_minimal.cfg
    install -Dm0644 /files/grub_boot_otheros.cfg \
        /usr/lib/bootupd/grub2-static/configs.d/40_grub_boot_otheros.cfg

    install -dm0755 /usr/lib/systemd/system-preset
    cat > /usr/lib/systemd/system-preset/80-anatase-grub.preset <<'EOF'
    enable grub-boot-success.timer
    enable grub-boot-success.service
    disable grub-boot-indeterminate.service
    EOF
    systemctl preset \
        grub-boot-success.timer \
        grub-boot-success.service \
        grub-boot-indeterminate.service || true

    # Tweak grub2-mkconfig target to work on ostree systems
    if [ -f /usr/bin/grub2-mkconfig ] && \
        grep -q 'grub_probe} --target=device /`' /usr/bin/grub2-mkconfig; then
        sed -i 's|grub_probe} --target=device /`|grub_probe} --target=device /sysroot`|' \
            /usr/bin/grub2-mkconfig
    fi
