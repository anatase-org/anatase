version: 1

packages:
    - efibootmgr
    - grub2-efi-ia32
    - grub2-efi-x64
    - grub2-pc
    - shim-ia32
    - shim-x64
    - grub2-tools-extra

files:
    - grub-boot-remount
    - grub-boot-success
    - grub-boot-success.service
    - grub-boot-success.timer

postprocess: |
    set -eux

    install -Dm0755 /files/grub-boot-remount \
        /usr/libexec/grub-boot-remount
    install -Dm0755 /files/grub-boot-success \
        /usr/libexec/grub-boot-success
    install -Dm0644 /files/grub-boot-success.service \
        /usr/lib/systemd/system/grub-boot-success.service
    install -Dm0644 /files/grub-boot-success.timer \
        /usr/lib/systemd/system/grub-boot-success.timer

    systemctl enable grub-boot-success.timer
    systemctl enable grub-boot-success.service

    systemctl --global disable grub-boot-success.timer || true
    systemctl disable grub-boot-indeterminate.service || true

    # Tweak grub2-mkconfig target to work on ostree systems
    if [ -f /usr/bin/grub2-mkconfig ] && \
        grep -q 'grub_probe} --target=device /`' /usr/bin/grub2-mkconfig; then
        sed -i 's|grub_probe} --target=device /`|grub_probe} --target=device /sysroot`|' \
            /usr/bin/grub2-mkconfig
    fi
