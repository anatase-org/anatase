version: 1
packages:
  # Python
  - python3
  - python3-pip
  - python3-virtualenv

  # Shells and editors
  - fish
  - zsh
  - nano

  # System inspection and diagnostics
  - htop
  - i2c-tools
  - libinput-utils
  - lm_sensors
  - lsof
  - stress-ng

  # Admin tools
  - fpaste
  - git-core
  - git-core-doc
  - lrzsz
  - man-db
  - man-pages
  - mpage
  - pinfo
  - rsync
  - sos
  - whois

  # Terminal use
  - tmux
  - screen
  - fastfetch

postprocess: |
  set -eux

  #
  # Modt config
  #

  # Disable last login from being shown in ssh connections
  install -dm0755 /etc/ssh/sshd_config.d
  cat > /etc/ssh/sshd_config.d/80-anatase-lastlog.conf <<'EOF'
  PrintLastLog no
  EOF
  chmod 0644 /etc/ssh/sshd_config.d/80-anatase-lastlog.conf
