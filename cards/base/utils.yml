version: 1
packages:
  # Python
  - python3
  - python3-pip
  - python3-virtualenv

  # Shells and editors
  - fish
  - zsh
  - nano

  # System inspection and diagnostics
  - htop
  - i2c-tools
  - libinput-utils
  - lm_sensors
  - lsof
  - stress-ng

  # Admin tools
  - fpaste
  - git-core
  - git-core-doc
  - lrzsz
  - man-db
  - man-pages
  - mpage
  - pinfo
  - rsync
  - sos
  - whois

  # Terminal use
  - tmux
  - screen
  - fastfetch

postprocess: |
  set -eux

  #
  # Modt config
  #

  install -dm0755 /etc/profile.d
  cat > /etc/profile.d/11-anatase-motd.sh <<'EOF'
  # Show the Anatase fastfetch banner for interactive shell sessions.
  case $- in
      *i*) ;;
      *) return 0 2>/dev/null || exit 0 ;;
  esac

  if [ -t 1 ] &&
      [ -z "${ANATASE_DISABLE_MOTD:-}" ] &&
      [ -z "${ANATASE_MOTD_SHOWN:-}" ] &&
      command -v fastfetch >/dev/null 2>&1; then
      ANATASE_MOTD_SHOWN=1
      export ANATASE_MOTD_SHOWN
      echo
      fastfetch
      echo
  fi
  EOF
  chmod 0644 /etc/profile.d/11-anatase-motd.sh

  # Disable last login from being shown in ssh connections
  install -dm0755 /etc/ssh/sshd_config.d
  cat > /etc/ssh/sshd_config.d/80-anatase-lastlog.conf <<'EOF'
  PrintLastLog no
  EOF
  chmod 0644 /etc/ssh/sshd_config.d/80-anatase-lastlog.conf
