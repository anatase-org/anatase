version: 1
packages:
  # Python
  - python3
  - python3-pip
  - python3-virtualenv

  # Shells and editors
  - fish
  - zsh
  - nano

  # System inspection and diagnostics
  - htop
  - nvtop
  - i2c-tools
  - libinput-utils
  - lm_sensors
  - lsof
  - stress-ng

  # Admin tools
  - fpaste
  - git-core
  - git-core-doc
  - lrzsz
  - man-db
  - man-pages
  - mpage
  - pinfo
  - rsync
  - sos
  - whois

  # Terminal use
  - tmux
  - screen
  - fastfetch

  # Compression and archives
  - 7zip
  - bzip2
  - cpio
  - tar
  - unrar-free # consider unar in the future, but it is 5mb, not 50kb
  - unzip
  - zip

  # Containers
  - flatpak
  - flatpak-spawn
  - fuse-overlayfs
  - podman
  - podman-compose
  - buildah
  - skopeo
  - slirp4netns

  # Misc
  # GPT loves rg, don't fight it
  - ripgrep

  # Translation binfmts that are loaded
  # from the initramfs to the kernel
  # Required for foreign arch emulation
  # We need to provide these
  - qemu-user-static-x86
  - qemu-user-static-aarch64

  # Guest integration in VMs
  - hyperv-daemons
  - open-vm-tools-desktop
  - qemu-guest-agent
  - spice-vdagent
  - spice-webdavd
  - virtualbox-guest-additions

  # Multi-gpu
  - switcheroo-control

postprocess: |
  set -eux

  # Fix unrar
  ln -s unrar-free /usr/bin/unrar

  #
  # Modt config
  #

  # Disable last login from being shown in ssh connections
  install -dm0755 /etc/ssh/sshd_config.d
  cat > /etc/ssh/sshd_config.d/80-anatase-lastlog.conf <<'EOF'
  PrintLastLog no
  EOF
  chmod 0644 /etc/ssh/sshd_config.d/80-anatase-lastlog.conf
