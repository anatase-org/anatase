# Device-tree and runtime-selected firmware is not listed in MODULE_FIRMWARE.
# Keep dracut's generic laptop ADSP and QUP selection; supplement it with the
# GPU firmware needed by Book4 Edge and Retroid devices, the X1P42100 Book4
# remoteprocs (not covered by dracut), and Retroid's auto-started ADSP/CDSP.
# Wi-Fi, Bluetooth, audio amplifiers and video firmware load from the real root.
for _anatase_qcom_fw in \
    /usr/lib/firmware/qcom/a740_sqe.fw{,.xz,.zst} \
    /usr/lib/firmware/qcom/gmu_gen70200.bin{,.xz,.zst} \
    /usr/lib/firmware/qcom/gen{70500,71500,71700}_{sqe.fw,gmu.bin}{,.xz,.zst} \
    /usr/lib/firmware/qcom/x1e80100/gen70500_zap.mbn{,.xz,.zst} \
    /usr/lib/firmware/qcom/x1p42100/gen71500_zap.mbn{,.xz,.zst} \
    /usr/lib/firmware/qcom/x1p42100/SAMSUNG/NP750XQB/{qcdxkmsucpurwa.mbn,qcadsp8380.mbn,adsp_dtbs.elf,qccdsp8380.mbn,cdsp_dtbs.elf}{,.xz,.zst} \
    /usr/lib/firmware/qcom/sm8550/retroidpocket/a740_zap.mbn{,.xz,.zst} \
    /usr/lib/firmware/qcom/sm8550/retroidpocket/{cdsp,cdsp_dtb}.mbn{,.xz,.zst} \
    /usr/lib/firmware/qcom/sm8550/retroidpocket/{rp6,rpnova}/{adsp,adsp_dtb}.mbn{,.xz,.zst} \
    /usr/lib/firmware/qcom/eliza/retroidpocket/rpduo/{gen71700_zap,adsp,adsp_dtb,cdsp,cdsp_dtb}.mbn{,.xz,.zst}; do
    [[ -f "${_anatase_qcom_fw}" ]] || continue
    install_items+=" ${_anatase_qcom_fw} "
done
unset _anatase_qcom_fw
