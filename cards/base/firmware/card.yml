version: 1

packages:
  - aarch64:
      - bcm283x-firmware
      - uboot-images-armv8

build-deps:
  - bash
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

specs:
  - spec: linux-firmware.spec
    files:
      - .gitignore
      - linux-firmware.spec
    packages:
      - amd-gpu-firmware
      - atheros-firmware
      - brcmfmac-firmware
      - cirrus-audio-firmware
      - intel-gpu-firmware
      - iwlbluetooth-firmware
      - iwlegacy-firmware
      - iwlwifi-dvm-firmware
      - iwlwifi-mld-firmware
      - iwlwifi-mvm-firmware
      - libertas-firmware
      - linux-firmware
      - linux-firmware-whence
      - mt7xxx-firmware
      # - nvidia-gpu-firmware # provided by proprietary driver
      - nxpwireless-firmware
      - qcom-wwan-firmware
      - realtek-firmware
      - tiwilink-firmware
      - x86_64:
          - amd-ucode-firmware
          - intel-audio-firmware
          - intel-npu-firmware
          - intel-vsc-firmware
        aarch64:
          - qcom-firmware
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/linux-firmware
      branch: rawhide

  - spec: steamdeck-audio.spec
    files:
      - steamdeck-audio.spec
      - steamdeck-audio-speaker-gain.patch
      - steamdeck-oled-speakers.conf
    packages:
      - x86_64:
          - steamdeck-audio

postprocess: |
    set -eux

    if [ "$arch" = "aarch64" ]; then
        # Stage Fedora's firmware, device trees, overlays and configuration
        # before the atomic card moves /boot into /usr/lib/ostree-boot.
        install -dm0755 /usr/lib/ludos/efi
        cp -R /boot/efi/. /usr/lib/ludos/efi/

        # Fedora's config.txt selects this filename for both Pi 4 and Pi 5.
        install -m0644 /usr/share/uboot/rpi_arm64/u-boot.bin \
            /usr/lib/ludos/efi/rpi-u-boot.bin
    fi
