version: 1

build-deps:
  - bash
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

specs:
  - spec: linux-firmware.spec
    files:
      - .gitignore
      - linux-firmware.spec
    packages:
      - amd-gpu-firmware
      - atheros-firmware
      - brcmfmac-firmware
      - cirrus-audio-firmware
      - intel-gpu-firmware
      - iwlegacy-firmware
      - iwlwifi-dvm-firmware
      - iwlwifi-mld-firmware
      - iwlwifi-mvm-firmware
      - libertas-firmware
      - linux-firmware
      - linux-firmware-whence
      - mt7xxx-firmware
      # - nvidia-gpu-firmware # provided by proprietary driver
      - nxpwireless-firmware
      - qcom-wwan-firmware
      - realtek-firmware
      - tiwilink-firmware
      - x86_64:
          - amd-ucode-firmware
          - intel-audio-firmware
          - intel-vsc-firmware
        aarch64:
          - qcom-firmware
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/linux-firmware
      branch: rawhide

  - spec: steamdeck-audio.spec
    files:
      - steamdeck-audio.spec
      - steamdeck-audio-speaker-gain.patch
      - steamdeck-oled-speakers.conf
    packages:
      - x86_64:
          - steamdeck-audio
