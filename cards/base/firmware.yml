version: 1

packages:
  - alsa-sof-firmware
  - amd-gpu-firmware
  - amd-ucode-firmware
  - atheros-firmware
  - brcmfmac-firmware
  - cirrus-audio-firmware
  - intel-audio-firmware
  - intel-gpu-firmware
  - intel-vsc-firmware
  - iwlegacy-firmware
  - iwlwifi-dvm-firmware
  - iwlwifi-mvm-firmware
  - libertas-firmware
  - linux-firmware
  - microcode_ctl
  - mt7xxx-firmware
  # - nvidia-gpu-firmware
  - nxpwireless-firmware
  - qcom-wwan-firmware
  - realtek-firmware
  - tiwilink-firmware

files:
  - hwfirm::git+https://github.com/hhd-dev/hwfirm

postprocess: |
  set -eux

  install -d /usr/lib/firmware/cirrus /usr/lib/firmware/rtl_bt
  cp -r /files/hwfirm/cirrus/. /usr/lib/firmware/cirrus/
  cp -r /files/hwfirm/rtl_bt/. /usr/lib/firmware/rtl_bt/
  cp -r /files/hwfirm/awinic/. /usr/lib/firmware/
  cp -r /files/hwfirm/tas/. /usr/lib/firmware/
  find /files/hwfirm/xone -maxdepth 1 -type f -name 'x*' -exec cp -t /usr/lib/firmware/ {} +
  rm -f /usr/lib/firmware/rtl_bt/rtl8822cu_config.bin.xz
