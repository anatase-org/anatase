version: 1

env:
  tag: $tag

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

files:
  - cockpit-branding.css

# Prevent env invalidating the build hash
hash: >
  @hash(
    anatase-logos.spec,
    COPYING,
    ./favicon.svg,
    letterhead-onblack.svg,
    letterhead-onwhite.svg
  )

specs:
  - spec: anatase-logos.spec
    files:
      - "*.svg"
      - COPYING
    packages:
      - anatase-logos
      - fedora-logos

postprocess: |
  echo "OS Release file (/etc/os-release):"
  cat | tee /usr/lib/os-release <<'EOF'
  NAME="Anatase"
  VERSION="$tag"
  RELEASE_TYPE=stable
  ID=anatase
  ID_LIKE=fedora
  VERSION_ID=$releasever
  VERSION_CODENAME=""
  PRETTY_NAME="Anatase"
  ANSI_COLOR="1;38;2;248;221;11"
  LOGO=anatase-logo-icon
  CPE_NAME="cpe:/o:fedoraproject:fedora:$releasever"
  DEFAULT_HOSTNAME="anatase"
  HOME_URL="https://anatase.org/"
  DOCUMENTATION_URL="https://docs.anatase.org/"
  SUPPORT_URL="https://ask.fedoraproject.org/"
  BUG_REPORT_URL="https://github.com/anatase-org/anatase/issues"
  EOF

  # Cockpit selects branding by os-release ID. Anatase uses ID=anatase, so give
  # Cockpit and the Anaconda WebUI a matching branding directory.
  install -Dm0644 /files/cockpit-branding.css \
      /usr/share/cockpit/branding/anatase/branding.css
  ln -sfn ../../../pixmaps/system-logo-white.png \
      /usr/share/cockpit/branding/anatase/logo.png
  ln -sfn ../../../pixmaps/anatase-logo-sprite.png \
      /usr/share/cockpit/branding/anatase/apple-touch-icon.png
  ln -sfn ../../../../../etc/favicon.png \
      /usr/share/cockpit/branding/anatase/favicon.ico
