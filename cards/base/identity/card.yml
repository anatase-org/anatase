version: 1

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

files:
  - cockpit-branding.css
  - fastfetch/logo.txt
  - fastfetch/fastfetch.jsonc

# Prevent env invalidating the build hash
# do not readd: cockpit-branding.css
hash: >
  @hash(
    anatase-logos.spec,
    COPYING,
    ./favicon.svg,
    ./borderless-onblack.svg,
    ./borderless-onwhite.svg,
    letterhead-onblack.svg,
    letterhead-onwhite.svg,
    desktop-backgrounds
  )

specs:
  - spec: anatase-logos.spec
    files:
      - "*.svg"
      - COPYING
    packages:
      - anatase-logos
      - fedora-logos

  - spec: desktop-backgrounds/desktop-backgrounds.spec
    files:
      - "*.svg.in"
      - palette-day
      - palette-night
    packages:
      - desktop-backgrounds
      - desktop-backgrounds-gnome
      - desktop-backgrounds-kde

postprocess: |
  echo "OS Release file (/etc/os-release):"
  tee /usr/lib/os-release <<'EOF'
  NAME="Anatase"
  VERSION=""
  RELEASE_TYPE=stable
  ID=anatase
  ID_LIKE=fedora
  VERSION_ID=$releasever
  VERSION_CODENAME=""
  PRETTY_NAME="Anatase"
  ANSI_COLOR="1;38;2;248;221;11"
  LOGO=anatase-logo-icon
  CPE_NAME="cpe:/o:fedoraproject:fedora:$releasever"
  DEFAULT_HOSTNAME="anatase"
  HOME_URL="https://anatase.org/"
  DOCUMENTATION_URL="https://docs.anatase.org/"
  SUPPORT_URL="https://support.anatase.org/"
  BUG_REPORT_URL="https://github.com/anatase-org/anatase/issues"
  # Steam reads these
  VERSION_CODENAME="Anatase"
  BUILD_ID=""
  VARIANT_ID="original"
  EOF
  echo "Anatase" > /etc/system-release

  # Cockpit selects branding by os-release ID. Anatase uses ID=anatase, so give
  # Cockpit and the Anaconda WebUI a matching branding directory.
  install -Dm0644 /files/cockpit-branding.css \
      /usr/share/cockpit/branding/anatase/branding.css
  ln -sfn ../../../pixmaps/system-logo-white.png \
      /usr/share/cockpit/branding/anatase/logo.png
  ln -sfn ../../../pixmaps/anatase-logo-sprite.png \
      /usr/share/cockpit/branding/anatase/apple-touch-icon.png
  ln -sfn ../../../../../etc/favicon.png \
      /usr/share/cockpit/branding/anatase/favicon.ico

  # Fastfetch branding.
  install -Dm0644 /files/fastfetch/logo.txt \
      /usr/share/fastfetch/logos/anatase.txt
  install -Dm0644 /files/fastfetch/fastfetch.jsonc \
      /etc/xdg/fastfetch/config.jsonc
