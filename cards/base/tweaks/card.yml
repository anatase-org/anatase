version: 1

files:
  - sysctl.conf
  - memlock.conf
  - modules-load.conf
  - zram-generator.conf
  - dev-hugepages1G.mount
  - override-zsh.sh

build-deps:
  - fontforge
  - rpm-build
  - rpmdevtools
  - tar

specs:
  - spec: zsh/zsh-anatase.spec
    files:
      - anatase.sh
      - anatase-logo-mono.svg
      - patch-meslo-anatase.py
    packages:
      - zsh-anatase

postprocess: |
  set -eux

  #
  # Flatpaks
  #

  # Disable flatpak fedora remotes (they come from the flatpak package)
  rm -rf /etc/systemd/system/multi-user.target.wants/flatpak-add-fedora-repos.service \
    /usr/lib/systemd/system/flatpak-add-fedora-repos.service

  #
  # System policy
  #

  # Various configs
  install -Dm0644 /files/sysctl.conf \
      /usr/lib/sysctl.d/80-anatase.conf
  install -Dm0644 /files/memlock.conf \
      /etc/security/limits.d/80-anatase-memlock.conf
  install -Dm0644 /files/modules-load.conf \
      /usr/lib/modules-load.d/80-anatase.conf

  # Add zram and huge pages
  install -Dm0644 /files/zram-generator.conf \
      /etc/systemd/zram-generator.conf
  install -Dm0644 /files/dev-hugepages1G.mount \
      /usr/lib/systemd/system/dev-hugepages1G.mount

  #
  # Shell integration
  #

  install -Dm0644 /files/override-zsh.sh \
      /etc/profile.d/override-zsh.sh

  touch /etc/zshrc
  if ! grep -qF "source /usr/share/anatase/zsh/anatase.sh" /etc/zshrc; then
      {
          printf '\n%s\n' '# Source Anatase zsh defaults.'
          printf '%s\n' 'if [ -r /usr/share/anatase/zsh/anatase.sh ]; then'
          printf '%s\n' '    source /usr/share/anatase/zsh/anatase.sh'
          printf '%s\n' 'fi'
      } >> /etc/zshrc
  fi

  #
  # Stubs
  #

  # Stub pulseaudio as a compatibility shim (probably not needed anymore)
  if [ ! -e /usr/bin/pulseaudio ]; then
      ln -s /usr/bin/true /usr/bin/pulseaudio
  fi
  # Fix SteamVR probing for unversioned libdrm names at runtime
  if [ -e /usr/lib/libdrm.so.2 ] && [ ! -e /usr/lib/libdrm.so ]; then
      cp --no-dereference --preserve=links /usr/lib/libdrm.so.2 /usr/lib/libdrm.so
  fi
  if [ -e /usr/lib64/libdrm.so.2 ] && [ ! -e /usr/lib64/libdrm.so ]; then
      cp --no-dereference --preserve=links /usr/lib64/libdrm.so.2 /usr/lib64/libdrm.so
  fi

  #
  # Fonts
  #

  install -dm0755 /usr/share/fonts/anatase
  if command -v fc-cache >/dev/null 2>&1; then
      fc-cache -f /usr/share/fonts/anatase
  fi

  #
  # Firewall
  #

  # Enable our custom rules
  # Specifically, we want to allow input to ports 1025:65535
  for ufw_family in user user6; do
      if [ "${ufw_family}" = user ]; then
          ufw_rules=/usr/share/ufw/iptables/user.rules
          ufw_chain=ufw-user-input
          ufw_addr=0.0.0.0/0
      else
          ufw_rules=/usr/share/ufw/iptables/user6.rules
          ufw_chain=ufw6-user-input
          ufw_addr=::/0
      fi

      for ufw_protocol in tcp udp; do
          ufw_rule="-A ${ufw_chain} -p ${ufw_protocol} -m multiport --dports 1025:65535 -j ACCEPT"
          ufw_tuple="### tuple ### allow ${ufw_protocol} 1025:65535 ${ufw_addr} any ${ufw_addr} in"

          if ! grep -qF -- "${ufw_rule}" "${ufw_rules}"; then
              sed -i "/^### END RULES ###/i\\${ufw_tuple}\\n${ufw_rule}\\n" "${ufw_rules}"
          fi
      done
  done

  # Configure ufw to use /etc/ufw/lib for local state instead of /var
  install -dm0755 /etc/ufw/lib /usr/lib/tmpfiles.d
  install -Dm0644 /usr/share/ufw/iptables/user.rules /etc/ufw/lib/user.rules
  install -Dm0644 /usr/share/ufw/iptables/user6.rules /etc/ufw/lib/user6.rules

  cat > /usr/lib/tmpfiles.d/anatase-ufw.conf <<'EOF'
  L+ /var/lib/ufw - - - - /etc/ufw/lib
  EOF

  # Just for the container (Dangerous)
  rm -rf /var/lib/ufw
  ln -s /etc/ufw/lib /var/lib/ufw

  # Enable
  systemctl enable ufw.service
