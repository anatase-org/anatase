# Installed under /run/systemd/sleep.conf.d/40-anatase-hardware.conf on
# hardware matched by anatase-sleep-policy.service, and recomputed each boot.
# Override in /etc/systemd/sleep.conf.d/ with a later drop-in, or mask this
# filename there with a symlink to /dev/null.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
