build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

specs:
  - spec: plasma-setup/plasma-setup.spec
    files:
      - overrides.patch
      - plasma-setup-*.patch
    packages:
      - plasma-setup
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/plasma-setup
      branch: f$releasever
    patch:
      type: git
      url: https://invent.kde.org/plasma/plasma-setup
      ref: v${spec:Version}
      file: overrides.patch
  - spec: plasma-mobile/plasma-mobile.spec
    files:
      - "*.patch"
      - plasma-mobile.spec
    packages:
      - plasma-mobile
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/plasma-mobile
      branch: f$releasever
    patch:
      type: git
      url: https://invent.kde.org/plasma/plasma-mobile
      ref: v${spec:Version}
      file: overrides.patch
  - spec: kwin/kwin.spec
    files:
      - .gitignore
      - 2d0613acd044544e79b034b1cbc248664edf2884.patch
      - kwin.spec
      - overrides.patch
    packages:
      - kwin
      - kwin-common
      - kwin-libs
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/kwin
      branch: f$releasever
    patch:
      type: git
      url: https://invent.kde.org/plasma/kwin
      ref: v${spec:Version}
      file: overrides.patch
  - spec: plasma-login-manager/plasma-login-manager.spec
    files:
      - plasma-login-manager.spec
      - plasmalogin-environment_file.patch
      - plasmalogin-rpmostree-tmpfiles-hack.patch
      - plasmalogin.conf
      - plasmalogin.sysconfig
      - plasmalogin.sysusers
      - "*.patch"
    packages:
      - plasma-login-manager
      - kcm-plasmalogin
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/plasma-login-manager
      branch: f$releasever
    patch:
      type: git
      url: https://invent.kde.org/plasma/plasma-login-manager
      ref: v${spec:Version}
      file: overrides.patch

files:
    - color-schemes/AnataseDark.colors
    - color-schemes/AnataseLight.colors
    - konsole/Anatase.profile
    - konsole/AnataseDark.colorscheme
    - kwallet/anatase-empty-password-kwallet
    - kwallet/anatase-empty-password-kwallet.service
    - theme/defaults
    - theme/splash-preview.png
    - theme/splash.qml

postprocess: |
    set -eux

    kwin_version="$(rpm -q --qf '%{VERSION}' kwin)"
    plasma_workspace_version="$(rpm -q --qf '%{VERSION}' plasma-workspace)"

    if [ "${kwin_version}" != "${plasma_workspace_version}" ]; then
        echo "KWin and Plasma Workspace versions diverged: kwin=${kwin_version}, plasma-workspace=${plasma_workspace_version}" >&2
        exit 1
    fi
    

    install -dm0755 \
        /etc/xdg \
        /usr/lib/systemd/system \
        /usr/lib/systemd/system-preset \
        /usr/lib/systemd/user \
        /usr/lib/systemd/user/plasma-workspace.target.wants \
        /usr/lib/systemd/system-environment-generators \
        /usr/lib/systemd/user-environment-generators \
        /usr/lib/tmpfiles.d \
        /usr/libexec

    # Enable weekly auto updates in Discover. In the future, Flatpaks will be
    # updated daily. See: https://bugs.kde.org/show_bug.cgi?id=454422
    cat > /etc/xdg/PlasmaDiscoverUpdates <<'EOF'
    [Global]
    UseUnattendedUpdates=true
    RequiredNotificationInterval=604800
    EOF

    # Feature the Flatpaks published by Anatase in Discover's Editor's Choice
    install -dm0755 /usr/share/discover
    cat > /usr/share/discover/anatase-featured.json <<'EOF'
    [
        "appstream://org.anatase.Browser",
        "appstream://org.anatase.Steam",
        "appstream://org.anatase.ArchiveManager",
        "appstream://org.anatase.DiskUsageAnalyzer",
        "appstream://org.anatase.ImageViewer",
        "appstream://org.anatase.TextEditor",
        "appstream://org.anatase.Calculator",
        "appstream://org.anatase.DocumentViewer"
    ]
    EOF
    cat > /usr/share/discover/featuredurlrc <<'EOF'
    [Software]
    FeaturedListingURL=file:///usr/share/discover/anatase-featured.json
    EOF

    # Keep Discover's update notifier out of the temporary first-run setup
    # session, while preserving the global update defaults for real users.
    cat > /usr/lib/tmpfiles.d/zz-anatase-plasma-setup-discover.conf <<'EOF'
    # Disable Discover update checks in the ephemeral plasma-setup session.
    f /run/plasma-setup/.config/PlasmaDiscoverUpdates 0644 plasma-setup plasma-setup - [Global]\nUseUnattendedUpdates=false\nRequiredNotificationInterval=0
    f /run/plasma-setup/.config/autostart/org.kde.discover.notifier.desktop 0644 plasma-setup plasma-setup - [Desktop Entry]\nHidden=true
    EOF

    # Workaround for missing shadow and gshadow entries for plasmalogin.
    # See: https://forge.fedoraproject.org/kde/tickets/issues/684
    cat > /usr/lib/systemd/system/fedora-kinoite-plasmalogin-workaround.service <<'EOF'
    [Unit]
    Description=Workaround for missing plasmalogin entries in /etc/shadow and /etc/gshadow on Kinoite
    Documentation=https://forge.fedoraproject.org/kde/SIG/issues/684
    ConditionPathIsReadWrite=/etc
    ConditionPathExists=/run/ostree-booted
    ConditionPathExists=!/etc/.fedora-kinoite-plasmalogin-workaround
    Before=plasmalogin.service

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/usr/libexec/fedora-kinoite-plasmalogin-workaround

    [Install]
    WantedBy=multi-user.target
    EOF

    cat > /usr/libexec/fedora-kinoite-plasmalogin-workaround <<'EOF'
    #!/bin/sh
    # See: https://forge.fedoraproject.org/kde/tickets/issues/684

    set -eu

    echo "Checking plasmalogin entries in /etc/shadow and /etc/gshadow"

    if ! grep -q '^plasmalogin:' /etc/shadow; then
        echo 'plasmalogin:!*:::::::' >> /etc/shadow
        echo "Added missing plasmalogin entry to /etc/shadow"
    else
        echo "Nothing to do for /etc/shadow"
    fi

    if ! grep -q '^plasmalogin:' /etc/gshadow; then
        echo 'plasmalogin:!*::' >> /etc/gshadow
        echo "Added missing plasmalogin entry to /etc/gshadow"
    else
        echo "Nothing to do for /etc/gshadow"
    fi

    echo "Writing stamp file: /etc/.fedora-kinoite-plasmalogin-workaround"
    touch /etc/.fedora-kinoite-plasmalogin-workaround
    EOF

    chmod a+x /usr/libexec/fedora-kinoite-plasmalogin-workaround

    cat > /usr/lib/systemd/system-preset/82-kinoite.preset <<'EOF'
    # See: https://forge.fedoraproject.org/kde/tickets/issues/684
    enable fedora-kinoite-plasmalogin-workaround.service
    EOF

    systemctl preset fedora-kinoite-plasmalogin-workaround.service || true

    # Just the app store, browser, and discover
    kicker_extra_favorites=/usr/share/kde-settings/kde-profile/default/xdg/kicker-extra-favoritesrc
    install -dm0755 "$(dirname "${kicker_extra_favorites}")"
    cat > "${kicker_extra_favorites}" <<'EOF'
    [General]
    Prepend=preferred://browser;org.kde.dolphin.desktop;org.kde.discover.desktop
    IgnoreDefaults=true
    EOF

    # If a user genuinely has no password, create a matching empty-password
    # KWallet before desktop apps can trigger the interactive first-use dialog.
    install -Dm0755 /files/kwallet/anatase-empty-password-kwallet \
        /usr/libexec/anatase-empty-password-kwallet
    install -Dm0644 /files/kwallet/anatase-empty-password-kwallet.service \
        /usr/lib/systemd/user/anatase-empty-password-kwallet.service
    ln -snf ../anatase-empty-password-kwallet.service \
        /usr/lib/systemd/user/plasma-workspace.target.wants/anatase-empty-password-kwallet.service

    #
    # Fix VM graphics freezes when using GL on kwin
    #

    cat > /usr/libexec/anatase-kwin-compose-environment <<'EOF'
    #!/bin/sh
    set -eu

    is_qemu_vm() {
        if command -v systemd-detect-virt >/dev/null 2>&1; then
            case "$(systemd-detect-virt --vm 2>/dev/null || true)" in
                qemu|kvm)
                    return 0
                    ;;
            esac
        fi

        for path in \
            /sys/class/dmi/id/sys_vendor \
            /sys/class/dmi/id/product_name \
            /sys/class/dmi/id/board_vendor; do
            [ -r "${path}" ] || continue
            case "$(cat "${path}" 2>/dev/null || true)" in
                *QEMU*|*KVM*)
                    return 0
                    ;;
            esac
        done

        return 1
    }

    if is_qemu_vm; then
        printf 'KWIN_COMPOSE=Q\n'
    fi
    EOF
    chmod 0755 /usr/libexec/anatase-kwin-compose-environment
    ln -snf /usr/libexec/anatase-kwin-compose-environment \
        /usr/lib/systemd/system-environment-generators/30-anatase-kwin-compose
    ln -snf /usr/libexec/anatase-kwin-compose-environment \
        /usr/lib/systemd/user-environment-generators/30-anatase-kwin-compose

    #
    # Themes
    #
    lookandfeel_dir=/usr/share/plasma/look-and-feel

    install -Dm0644 /files/color-schemes/AnataseDark.colors \
        /usr/share/color-schemes/AnataseDark.colors
    install -Dm0644 /files/color-schemes/AnataseLight.colors \
        /usr/share/color-schemes/AnataseLight.colors
    install -Dm0644 /files/konsole/AnataseDark.colorscheme \
        /usr/share/konsole/AnataseDark.colorscheme
    install -Dm0644 /files/konsole/Anatase.profile \
        /usr/share/konsole/Anatase.profile

    rm -rf \
        "${lookandfeel_dir}/org.fedoraproject.fedora.desktop" \
        "${lookandfeel_dir}/org.fedoraproject.fedoradark.desktop" \
        "${lookandfeel_dir}/org.fedoraproject.fedoralight.desktop"

    # Start from complete Breeze packages, then overlay the variant settings.
    cp -a "${lookandfeel_dir}/org.kde.breeze.desktop" "${lookandfeel_dir}/org.anatase.anatase.desktop"
    cp -a "${lookandfeel_dir}/org.kde.breeze.desktop" "${lookandfeel_dir}/org.anatase.anataselight.desktop"

    # Anatase defaults to dark, while anataselight uses Breeze.
    cp -a "${lookandfeel_dir}/org.kde.breezedark.desktop"/. "${lookandfeel_dir}/org.anatase.anatase.desktop"

    write_anatase_defaults() {
        theme_dir="${1}"
        color_scheme="${2}"
        icon_theme="${3}"
        splash_theme="${4}"
        accent_color="${5}"
        defaults_file="${theme_dir}/contents/defaults"

        install -m0644 /files/theme/defaults "${defaults_file}"
        sed -i \
            -e "s|@ACCENT_COLOR@|${accent_color}|g" \
            -e "s|@COLOR_SCHEME@|${color_scheme}|g" \
            -e "s|@ICON_THEME@|${icon_theme}|g" \
            -e "s|@SPLASH_THEME@|${splash_theme}|g" \
            "${defaults_file}"
    }

    write_anatase_defaults \
        "${lookandfeel_dir}/org.anatase.anatase.desktop" \
        AnataseDark \
        breeze-dark \
        org.anatase.anatase.desktop \
        "190,166,40"
    write_anatase_defaults \
        "${lookandfeel_dir}/org.anatase.anataselight.desktop" \
        AnataseLight \
        breeze \
        org.anatase.anatase.desktop \
        "207,184,49"
    #   /\ this is the dark default theme splash screen as they are the same

    write_start_here_plasmoid_setup() {
        theme_dir="${1}"
        setup_dir="${theme_dir}/contents/plasmoidsetupscripts"

        install -dm0755 "${setup_dir}"
        for plasmoid in org.kde.plasma.kickoff org.kde.plasma.kicker org.kde.plasma.kickerdash; do
            printf '%s\n' \
                'if ( applet.readConfig("icon", "start-here-kde") == "start-here-kde" ) {' \
                '  applet.currentConfigGroup = ["General"]' \
                '  applet.writeConfig("icon", "start-here");' \
                '}' \
                > "${setup_dir}/${plasmoid}.js"
        done
    }

    write_start_here_plasmoid_setup "${lookandfeel_dir}/org.anatase.anatase.desktop"
    write_start_here_plasmoid_setup "${lookandfeel_dir}/org.anatase.anataselight.desktop"

    write_anatase_splash() {
        theme_dir="${1}"
        splash_dir="${theme_dir}/contents/splash"
        preview_dir="${theme_dir}/contents/previews"

        install -dm0755 "${splash_dir}/images"
        install -m0644 /usr/share/icons/hicolor/scalable/apps/anatase-splash.svg \
            "${splash_dir}/images/anatase.svg"
        install -m0644 /files/theme/splash.qml "${splash_dir}/Splash.qml"
        install -Dm0644 /files/theme/splash-preview.png "${preview_dir}/splash.png"
    }

    write_anatase_splash "${lookandfeel_dir}/org.anatase.anatase.desktop"

    # For anataselight drop the splash as its the same
    # write_anatase_splash "${lookandfeel_dir}/org.anatase.anataselight.desktop"
    rm -rf /usr/share/plasma/look-and-feel/org.anatase.anataselight.desktop/contents/splash/

    write_anatase_lookandfeel_metadata() {
        id="${1}"
        name="${2}"
        description="${3}"

        cat > "${lookandfeel_dir}/${id}.desktop/metadata.json" <<EOF
    {
        "KPackageStructure": "Plasma/LookAndFeel",
        "KPlugin": {
            "Authors": [
                {
                    "Name": "Anatase"
                }
            ],
            "Category": "",
            "Description": "${description}",
            "Id": "${id}.desktop",
            "License": "GPLv2+",
            "Name": "${name}"
        }
    }
    EOF
    }

    write_anatase_lookandfeel_metadata "org.anatase.anatase" "Anatase" "Anatase theme"
    write_anatase_lookandfeel_metadata "org.anatase.anataselight" "Anatase Light" "Anatase Light theme"

    # Make sure the default splash is ours
    sed -i -E \
        's|<default>org\.kde\.breeze\.desktop</default>|<default>org.anatase.anatase.desktop</default>|' \
        /usr/share/config.kcfg/splashscreensettings.kcfg

    # Apply our theme as a default
    kdeglobals=/usr/share/kde-settings/kde-profile/default/xdg/kdeglobals
    konsolerc=/etc/xdg/konsolerc
    ksplashrc=/usr/share/kde-settings/kde-profile/default/xdg/ksplashrc

    kwriteconfig6 --file "${kdeglobals}" --group KDE --key LookAndFeelPackage org.anatase.anatase.desktop
    kwriteconfig6 --file "${kdeglobals}" --group KDE --key DefaultDarkLookAndFeel org.anatase.anatase.desktop
    kwriteconfig6 --file "${kdeglobals}" --group KDE --key DefaultLightLookAndFeel org.anatase.anataselight.desktop
    kwriteconfig6 --file "${kdeglobals}" --group KDE --key ColorScheme --delete ''
    kwriteconfig6 --file "${kdeglobals}" --group General --key AccentColor "190,166,40"
    kwriteconfig6 --file "${kdeglobals}" --group General --key ColorScheme AnataseDark
    kwriteconfig6 --file "${kdeglobals}" --group Icons --key Theme breeze-dark
    kwriteconfig6 --file "${konsolerc}" --group "Desktop Entry" --key DefaultProfile Anatase.profile
    kwriteconfig6 --file "${ksplashrc}" --group KSplash --key Engine KSplashQML
    kwriteconfig6 --file "${ksplashrc}" --group KSplash --key Theme org.anatase.anatase.desktop

    # Plasma mobile
    # Removing this here is easier than in the package
    rm -rf /usr/share/plasma/look-and-feel/org.kde.breeze.mobile/

    # Remove twilight theme as it conflicts with our start button
    # TODO: Fix this
    rm -rf /usr/share/plasma/look-and-feel/org.kde.breezetwilight.desktop/
