    # System services
    - systemd-oomd-defaults
    - thermald

    # Debugging and X11 tools
    - gdb
    - xdpyinfo

build-deps:
  - bash
  - cmake
  - coreutils
  - findutils
  - rpm-build
  - rpmdevtools
  - ccache
  - sccache

specs:
  - spec: plasma-setup/plasma-setup.spec
    files:
      - overrides.patch
      - plasma-setup-*.patch
    packages:
      - plasma-setup
    upstream:
      type: dist-git
      url: https://src.fedoraproject.org/rpms/plasma-setup
      branch: f$releasever
    patch:
      type: git
      url: https://invent.kde.org/plasma/plasma-setup
      ref: v${spec:Version}
      file: overrides.patch


files:
    - color-schemes/AnataseDark.colors
    - color-schemes/AnataseLight.colors
    - splash-preview.png
    - splash.qml

postprocess: |
    set -eux

    install -dm0755 \
        /etc/xdg \
        /usr/lib/systemd/system \
        /usr/lib/systemd/system-preset \
        /usr/lib/tmpfiles.d \
        /usr/libexec

    # Enable weekly auto updates in Discover. In the future, Flatpaks will be
    # updated daily. See: https://bugs.kde.org/show_bug.cgi?id=454422
    cat > /etc/xdg/PlasmaDiscoverUpdates <<'EOF'
    [Global]
    UseUnattendedUpdates=true
    RequiredNotificationInterval=604800
    EOF

    # Keep Discover's update notifier out of the temporary first-run setup
    # session, while preserving the global update defaults for real users.
    cat > /usr/lib/tmpfiles.d/zz-anatase-plasma-setup-discover.conf <<'EOF'
    # Disable Discover update checks in the ephemeral plasma-setup session.
    f /run/plasma-setup/.config/PlasmaDiscoverUpdates 0644 plasma-setup plasma-setup - [Global]\nUseUnattendedUpdates=false\nRequiredNotificationInterval=0
    f /run/plasma-setup/.config/autostart/org.kde.discover.notifier.desktop 0644 plasma-setup plasma-setup - [Desktop Entry]\nHidden=true
    EOF

    # Workaround for missing shadow and gshadow entries for plasmalogin.
    # See: https://forge.fedoraproject.org/kde/tickets/issues/684
    cat > /usr/lib/systemd/system/fedora-kinoite-plasmalogin-workaround.service <<'EOF'
    [Unit]
    Description=Workaround for missing plasmalogin entries in /etc/shadow and /etc/gshadow on Kinoite
    Documentation=https://forge.fedoraproject.org/kde/SIG/issues/684
    ConditionPathIsReadWrite=/etc
    ConditionPathExists=/run/ostree-booted
    ConditionPathExists=!/etc/.fedora-kinoite-plasmalogin-workaround
    Before=plasmalogin.service

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/usr/libexec/fedora-kinoite-plasmalogin-workaround

    [Install]
    WantedBy=multi-user.target
    EOF

    cat > /usr/libexec/fedora-kinoite-plasmalogin-workaround <<'EOF'
    #!/bin/sh
    # See: https://forge.fedoraproject.org/kde/tickets/issues/684

    set -eu

    echo "Checking plasmalogin entries in /etc/shadow and /etc/gshadow"

    if ! grep -q '^plasmalogin:' /etc/shadow; then
        echo 'plasmalogin:!*:::::::' >> /etc/shadow
        echo "Added missing plasmalogin entry to /etc/shadow"
    else
        echo "Nothing to do for /etc/shadow"
    fi

    if ! grep -q '^plasmalogin:' /etc/gshadow; then
        echo 'plasmalogin:!*::' >> /etc/gshadow
        echo "Added missing plasmalogin entry to /etc/gshadow"
    else
        echo "Nothing to do for /etc/gshadow"
    fi

    echo "Writing stamp file: /etc/.fedora-kinoite-plasmalogin-workaround"
    touch /etc/.fedora-kinoite-plasmalogin-workaround
    EOF

    chmod a+x /usr/libexec/fedora-kinoite-plasmalogin-workaround

    cat > /usr/lib/systemd/system-preset/82-kinoite.preset <<'EOF'
    # See: https://forge.fedoraproject.org/kde/tickets/issues/684
    enable fedora-kinoite-plasmalogin-workaround.service
    EOF

    systemctl preset fedora-kinoite-plasmalogin-workaround.service || true

    #
    # Themes
    #
    lookandfeel_dir=/usr/share/plasma/look-and-feel

    install -Dm0644 /files/color-schemes/AnataseDark.colors \
        /usr/share/color-schemes/AnataseDark.colors
    install -Dm0644 /files/color-schemes/AnataseLight.colors \
        /usr/share/color-schemes/AnataseLight.colors

    rm -rf \
        "${lookandfeel_dir}/org.fedoraproject.fedora.desktop" \
        "${lookandfeel_dir}/org.fedoraproject.fedoradark.desktop" \
        "${lookandfeel_dir}/org.fedoraproject.fedoralight.desktop"

    # Start from complete Breeze packages, then overlay the variant settings.
    cp -a "${lookandfeel_dir}/org.kde.breeze.desktop" "${lookandfeel_dir}/org.anatase.anatase.desktop"
    cp -a "${lookandfeel_dir}/org.kde.breeze.desktop" "${lookandfeel_dir}/org.anatase.anataselight.desktop"

    # Anatase defaults to dark, while anataselight uses Breeze.
    cp -a "${lookandfeel_dir}/org.kde.breezedark.desktop"/. "${lookandfeel_dir}/org.anatase.anatase.desktop"

    # Do not use upstream plasma wallpaper
    sed -i -E 's/^Image=.*/Image=Default/' \
        "${lookandfeel_dir}/org.anatase.anatase.desktop/contents/defaults" \
        "${lookandfeel_dir}/org.anatase.anataselight.desktop/contents/defaults"

    # Use a special palette for dark
    sed -i -E 's/^ColorScheme=.*/ColorScheme=AnataseDark/' \
        "${lookandfeel_dir}/org.anatase.anatase.desktop/contents/defaults"

    # Use a special palette for light
    sed -i -E 's/^ColorScheme=.*/ColorScheme=AnataseLight/' \
        "${lookandfeel_dir}/org.anatase.anataselight.desktop/contents/defaults"

    # Select the matching splash screen when the global theme is applied.
    sed -i -E 's/^Theme=.*/Theme=org.anatase.anatase.desktop/' \
        "${lookandfeel_dir}/org.anatase.anatase.desktop/contents/defaults"
    sed -i -E 's/^Theme=.*/Theme=org.anatase.anataselight.desktop/' \
        "${lookandfeel_dir}/org.anatase.anataselight.desktop/contents/defaults"

    write_start_here_plasmoid_setup() {
        theme_dir="${1}"
        setup_dir="${theme_dir}/contents/plasmoidsetupscripts"

        install -dm0755 "${setup_dir}"
        for plasmoid in org.kde.plasma.kickoff org.kde.plasma.kicker org.kde.plasma.kickerdash; do
            printf '%s\n' \
                'if ( applet.readConfig("icon", "start-here-kde") == "start-here-kde" ) {' \
                '  applet.currentConfigGroup = ["General"]' \
                '  applet.writeConfig("icon", "start-here");' \
                '}' \
                > "${setup_dir}/${plasmoid}.js"
        done
    }

    write_start_here_plasmoid_setup "${lookandfeel_dir}/org.anatase.anatase.desktop"
    write_start_here_plasmoid_setup "${lookandfeel_dir}/org.anatase.anataselight.desktop"

    write_anatase_splash() {
        theme_dir="${1}"
        splash_dir="${theme_dir}/contents/splash"
        preview_dir="${theme_dir}/contents/previews"

        install -dm0755 "${splash_dir}/images"
        install -m0644 /usr/share/icons/hicolor/scalable/apps/anatase-splash.svg \
            "${splash_dir}/images/anatase.svg"
        install -m0644 /files/splash.qml "${splash_dir}/Splash.qml"
        install -Dm0644 /files/splash-preview.png "${preview_dir}/splash.png"
    }

    write_anatase_splash "${lookandfeel_dir}/org.anatase.anatase.desktop"
    write_anatase_splash "${lookandfeel_dir}/org.anatase.anataselight.desktop"

    write_anatase_lookandfeel_metadata() {
        id="${1}"
        name="${2}"
        description="${3}"

        cat > "${lookandfeel_dir}/${id}.desktop/metadata.json" <<EOF
    {
        "KPackageStructure": "Plasma/LookAndFeel",
        "KPlugin": {
            "Authors": [
                {
                    "Name": "Anatase"
                }
            ],
            "Category": "",
            "Description": "${description}",
            "Id": "${id}.desktop",
            "License": "GPLv2+",
            "Name": "${name}"
        }
    }
    EOF
    }

    write_anatase_lookandfeel_metadata "org.anatase.anatase" "Anatase" "Anatase theme"
    write_anatase_lookandfeel_metadata "org.anatase.anataselight" "Anatase Light" "Anatase Light theme"

    # Apply our theme as a default
    kdeglobals=/usr/share/kde-settings/kde-profile/default/xdg/kdeglobals
    ksplashrc=/usr/share/kde-settings/kde-profile/default/xdg/ksplashrc

    kwriteconfig6 --file "${kdeglobals}" --group KDE --key LookAndFeelPackage org.anatase.anatase.desktop
    kwriteconfig6 --file "${kdeglobals}" --group KDE --key DefaultDarkLookAndFeel org.anatase.anatase.desktop
    kwriteconfig6 --file "${kdeglobals}" --group KDE --key DefaultLightLookAndFeel org.anatase.anataselight.desktop
    kwriteconfig6 --file "${kdeglobals}" --group General --key ColorScheme AnataseDark
    kwriteconfig6 --file "${kdeglobals}" --group Icons --key Theme breeze-dark
    kwriteconfig6 --file "${ksplashrc}" --group KSplash --key Engine KSplashQML
    kwriteconfig6 --file "${ksplashrc}" --group KSplash --key Theme org.anatase.anatase.desktop
