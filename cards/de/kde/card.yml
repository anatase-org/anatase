    - audiocd-kio
    - dolphin
    - ffmpegthumbs
    - kde-connect
    - kdegraphics-thumbnailers
    - kdialog
    - kdnssd
    - kinfocenter
    - kio-gdrive
    - kmenuedit
    - konsole
    - kunifiedpush
    - kwalletmanager5
    - plasma-discover
    - plasma-discover-flatpak
    - plasma-discover-notifier
    - plasma-discover-rpm-ostree
    - plasma-systemmonitor
    - plasma-vault
    # A bit spammy
    # - plasma-welcome
    # - plasma-welcome-fedora
    - spectacle

    # Plasma desktop
    - aurorae
    - breeze-icon-theme
    - kdeplasma-addons
    - kf6-baloo-file
    - kscreen
    - kscreenlocker
    - kwin
    - plasma-breeze
    - plasma-desktop
    - plasma-desktop-doc
