    - plasma-keyboard
    - plasma-login-manager
    - plasma-pa
    - plasma-setup
    - plasma-workspace
    - plasma-workspace-wallpapers
    - polkit-kde

    # System settings
    - colord-kde
    - flatpak-kcm
    - fprintd-pam
    - kaccounts-integration-qt6
    - kaccounts-providers
    - kcm-plasmalogin
    - kde-gtk-config
    - kde-inotify-survey
    - kde-settings-plasmalogin
    - kde-settings-pulseaudio
    - kio-admin
    - ksshaskpass
    - pam-kwallet
    - pinentry-qt
    - plasma-disks
    - plasma-print-manager
    - plasma-thunderbolt
    - plasma-firewall
    - plasma-firewall-ufw
    - udisks2

    # Network integration
    - bluedevil
    - kdenetwork-filesharing
    - krdp
    - krfb
    - mobile-broadband-provider-info
    - plasma-nm
    - plasma-nm-openconnect
    - plasma-nm-openvpn
    - plasma-nm-vpnc
    - samba-usershares

    # Graphics and media
    - libappindicator-gtk3
    - phonon-qt6-backend-vlc
    - vlc-plugin-gstreamer
    - vulkan-tools
    - xwaylandvideobridge

    # Boot and theme
    - plymouth-system-theme
