version: 1

name: Anatase

oci:
  cosign:
    registry: https://i.anatase.org/
    identity: cosign.anatase.org
    verify: cards/base/atomic/keys/anatase-cosign-root.pem

flatpaks:
  images:
    uri: https://flatpaks.anatase.org/icons/
    s3: icons/
    overlay: ./flatpaks/overlay.png
  gpg:
    identity: https://flatpaks.anatase.org/
    lookaside: gpg
    verify: ./cards/base/atomic/keys/anatase-gpg.pub.asc
